<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡卡查克 · 雪原冒险</title>
    <style>
        :root {
            --bg: #0a0e17;
            --panel: #111827dd;
            --border: #1e3a5f;
            --text: #d0d8e8;
            --text2: #94a3b8;
            --accent: #5eb0e5;
            --gold: #f0c060;
            --rare: #7eb8da;
            --legend: #f0b830;
            --success: #5cb878;
            --warm: #e89050;
            --panel2: #141e2bdd;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px #00000055;
            --transition: 0.25s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(ellipse at 50% 0%, #1a2a3a 0%, #0a0e17 70%);
            background-attachment: fixed;
        }

        .snowfall { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .snowflake { position: absolute; top: -60px; color: #c8ddf8; font-size: 1rem; animation: fall linear infinite; opacity: 0.7; text-shadow: 0 0 6px #b0d0f8; }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.9; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(-15px); opacity: 0.15; }
        }

        .app-container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }
        .header { text-align: center; padding: 18px 10px 8px; z-index: 2; }
        .header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #d0e8ff, #7eb8da); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 2px; }
        .header .subtitle { font-size: 0.85rem; color: var(--text2); }

        .weather-tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; background: #1a3050; color: #b0d8f8; border: 1px solid #3a6088; white-space: nowrap; }

        .btn { padding: 9px 18px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 0.88rem; border: none; transition: var(--transition); letter-spacing: 0.03em; white-space: nowrap; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 10px #3a7bd544; }
        .btn-primary:hover { background: #6ec0f0; box-shadow: 0 4px 16px #3a7bd566; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--accent); color: #fff; }
        .btn-sm { padding: 5px 12px; font-size: 0.78rem; border-radius: 16px; }
        .btn-gold { background: linear-gradient(135deg, #c89030, #e0b050); color: #1a0e00; font-weight: 700; box-shadow: 0 2px 12px #e0b04044; }
        .btn-gold:hover { box-shadow: 0 4px 20px #e0b04066; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }

        .main-layout { display: flex; align-items: flex-start; gap: 16px; z-index: 2; margin-top: 8px; }
        .sidebar { width: 150px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; z-index: 2; }

        .traveler-bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: flex-start; background: var(--panel2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; box-shadow: var(--shadow); backdrop-filter: blur(6px); margin: 0; }
        .traveler-bar .stat { display: flex; align-items: center; gap: 3px; font-size: 0.75rem; white-space: nowrap; }
        .traveler-bar .stat .icon { font-size: 1.0rem; }
        .traveler-bar .stat .val { font-weight: 600; min-width: 24px; text-align: center; }
        .stat-bar-wrap { width: 36px; height: 4px; background: #1a2535; border-radius: 3px; overflow: hidden; }
        .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        .fill-temp { background: linear-gradient(90deg, #4a90d9, #e89050); }
        .fill-health { background: linear-gradient(90deg, #e05555, #5cb878); }
        .fill-hunger { background: linear-gradient(90deg, #c09040, #f0c060); }
        .fill-mood { background: linear-gradient(90deg, #7eb8da, #d0a0e0); }

        .tab-nav { display: flex; flex-direction: column; gap: 4px; width: 100%; }
        .tab-btn { justify-content: flex-start; padding: 9px 12px; width: 100%; text-align: left; font-size: 0.82rem; border-radius: 22px; border: 1px solid transparent; cursor: pointer; font-weight: 500; background: var(--panel2); color: var(--text2); transition: var(--transition); white-space: nowrap; backdrop-filter: blur(4px); }
        .tab-btn:hover { border-color: var(--border); color: var(--text); background: #1a2840dd; }
        .tab-btn.active { background: #1e3a55dd; color: #fff; border-color: var(--accent); box-shadow: 0 0 12px #3a7bd544; }

        .panel-area { flex: 1; height: 480px; overflow-y: auto; overflow-x: hidden; padding-right: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(6px); min-width: 0; }

        .panel { padding: 18px 20px; animation: fadeIn 0.35s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .panel h3 { font-size: 1.1rem; margin-bottom: 10px; color: #c8ddf8; display: flex; align-items: center; gap: 6px; }
        .panel h3 .icon { font-size: 1.2rem; }

        .input-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        .input-row input { padding: 9px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #0d1520; color: var(--text); font-size: 0.9rem; outline: none; transition: var(--transition); flex: 1; min-width: 120px; }
        .input-row input:focus { border-color: var(--accent); box-shadow: 0 0 8px #3a7bd533; }
        .input-row input.dur-input { flex: 0 0 90px; min-width: 70px; }

        .checkin-list { list-style: none; padding-right: 4px; }
        .checkin-list li { padding: 7px 0; border-bottom: 1px solid #1a2a3a; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .checkin-list .task-name { color: #c8ddf8; flex: 1; }
        .checkin-list .task-dur { color: var(--accent); font-weight: 600; white-space: nowrap; }
        .checkin-list .task-time { color: var(--text2); font-size: 0.75rem; white-space: nowrap; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding-right: 4px; }
        .card-item { background: #0d1520; border: 1px solid #2a3a50; border-radius: var(--radius-sm); padding: 12px; cursor: default; transition: var(--transition); position: relative; }
        .card-item:hover { border-color: #4a6a90; box-shadow: 0 2px 12px #00000044; }
        .card-item.rare { border-color: #3a6a90; box-shadow: 0 0 10px #3a7bd522; }
        .card-item.legend { border-color: #8a6a20; box-shadow: 0 0 16px #e0b04033; background: #141008; }
        .card-item .card-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .card-item.rare .card-name { color: #8ec8f0; }
        .card-item.legend .card-name { color: #f0c040; }
        .card-item .card-desc { font-size: 0.75rem; color: var(--text2); line-height: 1.35; margin-bottom: 8px; }
        .card-item .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .card-count { display: inline-block; background: #5eb0e533; color: #b0d8f8; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; margin-left: 4px; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
        .badge-common { background: #2a3a50; color: #a0b0c0; }
        .badge-rare { background: #1a3a50; color: #7eb8da; }
        .badge-legend { background: #3a2a10; color: #f0c040; }

        .adventure-event { background: #0d1520; border-left: 3px solid var(--accent); padding: 14px 16px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin: 10px 0; line-height: 1.6; font-size: 0.9rem; color: #c8d8e8; }
        .adventure-meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 0.85rem; color: var(--text2); }

        .backpack-list { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; }
        .backpack-list li { background: #1a2535; padding: 4px 10px; border-radius: 14px; font-size: 0.78rem; color: #b0c8d8; border: 1px solid #2a3a50; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999; background: #1e3050; color: #fff; padding: 12px 24px; border-radius: 24px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 8px 24px #00000066; animation: toastIn 0.35s ease, toastOut 0.4s ease 2.5s forwards; pointer-events: none; border: 1px solid #3a6088; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateX(-50%) translateY(0); } to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a3a50; border-radius: 2px; }

        .tomato-display { font-size: 2.4rem; font-weight: 700; text-align: center; color: #f0c040; margin: 8px 0; font-variant-numeric: tabular-nums; }
        .tomato-preset { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .tomato-preset .btn { font-size: 0.75rem; padding: 4px 10px; }
        .tomato-custom { padding: 4px 6px; border-radius: 16px; border: 1px solid var(--border); background: #0d1520; color: var(--text); font-size: 0.75rem; width: 70px; text-align: center; }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; gap: 12px; }
            .sidebar { width: 100%; flex-direction: column; gap: 10px; }
            .traveler-bar { width: 100%; justify-content: space-around; padding: 10px 8px; }
            .traveler-bar .stat { font-size: 0.8rem; }
            .stat-bar-wrap { width: 40px; }
            .tab-nav { flex-direction: row; flex-wrap: wrap; width: 100%; gap: 6px; }
            .tab-btn { width: auto; flex: 1 0 auto; padding: 10px 8px; font-size: 0.8rem; text-align: center; }
            .panel-area { height: calc(100vh - 340px); min-height: 350px; width: 100%; }
            .panel { padding: 14px 12px; }
            .input-row { flex-direction: column; gap: 8px; }
            .input-row input { width: 100%; }
            .input-row input.dur-input { flex: none; width: 100%; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
            .tomato-display { font-size: 2.2rem; margin: 10px 0; }
            .tomato-preset { justify-content: center; }
            .tomato-preset .btn { flex: 1 0 auto; padding: 8px 4px; font-size: 0.75rem; }
            .tomato-section > div:last-child { flex-wrap: wrap; gap: 8px; }
            .tomato-section > div:last-child .btn,
            .tomato-section > div:last-child input { flex: 1 0 auto; }
            #tomatoTaskInput { width: 100% !important; }
            .adventure-meta { flex-direction: column; align-items: flex-start; gap: 6px; }
        }
    </style>
</head>
<body>
<div class="snowfall" id="snowfall"></div>
<div id="toastContainer"></div>

<div class="app-container">
    <div class="header">
        <h1>❄️ 卡卡查克 · 雪原冒险</h1>
        <p class="subtitle">🏔️ 在冰原上留下你的足迹，与旅行者一同前行</p>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="traveler-bar" id="travelerBar">
                <span class="weather-tag" id="weatherTag">☁️ --</span>
                <div class="stat"><span class="icon">🌡️</span><span class="val" id="tempVal">-10</span>°C
                    <div class="stat-bar-wrap"><div class="stat-bar-fill fill-temp" id="tempBar" style="width:40%"></div></div>
                </div>
                <div class="stat"><span class="icon">❤️</span><span class="val" id="healthVal">80</span>
                    <div class="stat-bar-wrap"><div class="stat-bar-fill fill-health" id="healthBar" style="width:80%"></div></div>
                </div>
                <div class="stat"><span class="icon">🍞</span><span class="val" id="hungerVal">70</span>
                    <div class="stat-bar-wrap"><div class="stat-bar-fill fill-hunger" id="hungerBar" style="width:70%"></div></div>
                </div>
                <div class="stat"><span class="icon">😊</span><span class="val" id="moodVal">60</span>
                    <div class="stat-bar-wrap"><div class="stat-bar-fill fill-mood" id="moodBar" style="width:60%"></div></div>
                </div>
            </div>
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="checkin">📝 打卡</button>
                <button class="tab-btn" data-tab="adventure">🗺️ 冒险</button>
                <button class="tab-btn" data-tab="cards">🎴 卡牌</button>
                <button class="tab-btn" data-tab="stats">📊 统计</button>
            </div>
        </div>
        <div id="panelContainer" class="panel-area"></div>
    </div>
</div>

<script>
    (function() {
        // ==================== 物品池定义 ====================
        // 格式: [名称, 描述, 用户使用文本, 旅行者使用文本, 分类, 效果]
        // 分类: food/warm/medical/support
        const CARD_POOL = {
            "普通": [
                ["企鹅蛋","一枚圆滚滚的雪原企鹅蛋，带着尚未消散的体温。","你举起企鹅蛋对着光看了看，恍惚间好像看到里面有什么在轻轻晃动……也许是错觉，但这份期待让心情好了不少。","旅行者小心地把企鹅蛋裹进围巾里，轻声说了句谢谢。","support",{"hunger":10}],
                ["冰晶碎片","阳光透过云层洒下，这块冰晶碎片折射出彩虹。","你把冰晶碎片举到眼前，阳光立刻被分解成七色光带，像极了一只迷你的极光。你开心地把它别在背包上，觉得自己是雪原最靓的仔。","旅行者接过冰晶碎片，对着光看了看，微笑着把它挂在背包上。","support",{"mood":5}],
                ["保暖袜","用厚实的雪原牦牛绒织成，袜口绣着歪歪扭扭的“探险快乐”。","你凑近闻了闻，有一股淡淡的雪松香。虽然现在不穿，但光是把手指伸进去感受一下那份厚实，脚底板就仿佛涌起一股暖流。","旅行者立刻套上保暖袜，跺了跺脚：“这下踩冰河也不怕了，谢谢你！”","warm",{"temp":5}],
                ["雪原蘑菇","只在极夜过后的第一个黎明钻出地面，伞盖泛着淡蓝荧光。","你轻轻掰下一小片蘑菇盖，放进嘴里——先是薄荷般的清凉，接着微微的辛辣窜上鼻腔，最后胃里升起一团暖意。你赶紧把剩下的包好，留着下次打牙祭。","旅行者感激地点点头，把蘑菇掰成小块，说正好可以煮一锅驱寒汤。","food",{"hunger":8,"health":3}],
                ["冻原浆果","一串凝霜的深紫色小果，酸中带甜。","你摘下一颗放进嘴里，酸得皱起了整张脸，但紧随其后的甘甜又让你忍不住眯起眼睛。你决定把这串小果子当成秘密零食，每次只吃一颗。","旅行者吃了一颗浆果，眼睛一亮：“好甜！这下体力恢复了不少。”","food",{"hunger":6,"health":2}],
                ["冰钓竿","看似普通的钓竿，鱼线却织入了冰蚕丝。","你摸了摸冰凉的竿身，手感出乎意料地柔韧。你想象自己坐在冰洞口，忽然线一沉——说不定真能钓上什么稀奇古怪的东西。你满意地收好钓竿，觉得自己离冰钓大师又近了一步。","旅行者挥舞着钓竿：“这下不用愁食物了！”随后对你行了个礼。","food",{"hunger":12}],
                ["雪狐的脚印","一串逐渐消失在风中的脚印拓印。","你把脚印拓印凑到眼前，发现每一枚脚印里都有极细小的冰晶闪光。传说跟着它走能找到雪狐埋藏的宝贝，你笑了笑，珍重地把它夹进笔记本里。","旅行者把脚印拓印收进背包，神秘一笑：“说不定能带我去找到宝藏。”","support",{"mood":8}],
                ["融雪护符","一块刻有简易符文的木牌，能让积雪加速融化。","你用手指摩挲着护符上的符文，隐约能感受到一丝温热。你把护符贴在额头，许愿下次露营不用再抖帐篷——护符似乎轻轻震动了一下，仿佛在说“包在我身上”。","旅行者郑重地把护符挂在腰间：“这玩意儿实用！”","warm",{"temp":3,"mood":3}],
                ["霜花书签","一枚永远保持冰晶形状的透明书签。","你翻开最爱的书，把书签夹进去，书页立刻染上淡淡的冷香。你深吸一口气，仿佛连字迹都变得更好看了。果然，知识就是最好的保暖品。","旅行者把书签夹进自己随身的日记本里，轻声道：“知识就是最好的保暖品。”","support",{"mood":6}],
                ["旅人热汤配方","手写的配方残页，用雪水、根茎和一点点运气就能煮出驱散严寒的金色热汤。","你仔细辨认着残页上潦草的字迹，上面还画了一只歪歪扭扭的锅。你默默记下需要采集的植物，决定下次露营时亲自试试——说不定能煮出一锅让整个营地羡慕的传奇热汤。","旅行者如获至宝，立刻生火试着煮了一锅，边喝边感慨：“这汤，暖到心窝了。”","food",{"hunger":15,"health":8,"temp":5}],
            ],
            "稀有": [
                ["极光披风","采集极光丝线织成的披风，白天如水般透明，夜晚会流淌着淡绿与紫。","你轻轻展开披风，室内光线暗处果然泛出幽幽的极光色。你把它披在肩上原地转了一圈，感觉自己就像行走的极光，今晚的梦一定很绚烂。","旅行者披上披风，整个人都仿佛隐形于极光之中，他感激地朝你挥手。","warm",{"temp":5,"mood":5}],
                ["驯鹿铃","轻轻摇响，清脆的铃声穿透风雪，友善的驯鹿便会循声而来。","你捏着铃铛轻轻晃了晃，叮——声音不大却异常清晰。你把它挂在背包上，想象有一天在风雪中摇响它，会有一头毛茸茸的驯鹿探出头来。","旅行者摇了摇铃铛，不一会儿果然有驯鹿靠近，他跨上鹿背：“谢了，这下走得快多了！”","support",{"mood":8,"health":5}],
                ["雪原地图·残篇","标有一处神秘冰洞的模糊地图，边缘写着“此地有远古回响”。","你摊开残旧的地图，发现上面用不同颜色的墨水标注了好几处危险。你用手指顺着路线划过去，虽然缺了一半，但凭直觉也能猜出大致的方位。你决定先把地图收好，也许哪天会派上大用场。","旅行者仔细研究了地图，若有所思：“或许我能找到另一半。”","support",{"mood":10}],
                ["冰洞密码","一行古老的符文，据说念对它，就能开启某座冰封洞穴的无形之门。","你对着空气低声念出那串符文，喉咙里发出一种古怪的共鸣。周围的空气好像凝滞了一秒，然后一切恢复如常。你不确定门开没开，但好歹知道自己的发音还挺像那么回事的。","旅行者默默记下符文，轻声说：“等需要的时候，我会用它。”","support",{"mood":12}],

        const DROP_POOL = {

        // ==================== 全局配置与工具 ====================
        const UTC_OFFSET_HOURS = 8;
        const ADVENTURE_REFRESH_SEC = 30 * 60;
        const TICK_INTERVAL_MS = 8000;
        const MAX_OFFLINE_HOURS = 48;

        const WEATHERS = ["暴风雪","晴朗","极夜","雾凇","冰雹","小雪","极光","冻雨","白化天","钻石尘"];
        const EVENTS = [
            "旅行者正与一头饥肠辘辘的雪原狼对峙，手中紧握着唯一的武器——一根冻得发硬的鱼干。",
            "旅行者被卷入一场突如其来的白毛风中，他死死拽着驯鹿的缰绳，嘴里灌满了冰碴。",
            "旅行者踩塌了冰层，半条腿陷入刺骨的河水，他挣扎着爬上来，却发现靴子冻成了冰坨子。",
            // ... 其余事件同前，省略
        ];

        function getLocalDate(ts = Date.now()) { const d = new Date(ts + UTC_OFFSET_HOURS*3600000); return d.toISOString().slice(0,10); }
        function getToday() { return getLocalDate(); }
        function getYesterday() { const d = new Date(Date.now() + UTC_OFFSET_HOURS*3600000 - 86400000); return d.toISOString().slice(0,10); }
        function randInt(max) { return Math.floor(Math.random()*max); }
        function randChoice(arr) { return arr[randInt(arr.length)]; }
        function clamp(v,lo,hi) { return Math.max(lo, Math.min(hi, v)); }

        // localStorage 管理
        const LS_KEYS = { userData:'kaka_user_data', traveler:'kaka_traveler_state', adventure:'kaka_adventure_state' };
        function loadJSON(key, fallback) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch(e) { return fallback; } }
        function saveJSON(key, data) { try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {} }

        let userData = loadJSON(LS_KEYS.userData, {
            checkins: {}, cards: [], lastDailyDraw: null, weeklyEggClaimed: null, dailyDropClaimed: null
        });
        let travelerState = loadJSON(LS_KEYS.traveler, {
            temperature: -10, health: 80, hunger: 70, mood: 60,
            backpack: [], log: [], lastUpdate: Date.now() / 1000
        });
        let adventureState = loadJSON(LS_KEYS.adventure, {
            weather: '晴朗', event: '旅行者正在雪原上跋涉，四周一片寂静，只有风声相伴。', updatedAt: 0
        });

        function saveAll() {
            saveJSON(LS_KEYS.userData, userData);
            saveJSON(LS_KEYS.traveler, travelerState);
            saveJSON(LS_KEYS.adventure, adventureState);
        }

        // ==================== 物品查询与堆叠管理 ====================
        function getItemByName(name) {
            for (const pool of Object.values(CARD_POOL)) for (const item of pool) if (item[0] === name) return item;
            for (const pool of Object.values(DROP_POOL)) for (const item of pool) if (item[0] === name) return item;
            return null;
        }
        function getCardUseInfo(name) { const i=getItemByName(name); return i?{ name:i[0], desc:i[1], useText:i[2] }:null; }
        function getTravelerUseText(name) { const i=getItemByName(name); return i?i[3]:null; }
        function getItemEffect(name) { const i=getItemByName(name); return i?i[5]:null; }
        function getItemCategory(name) { const i=getItemByName(name); return i?i[4]:null; }
        function getCardRarity(name) {
            for (const [r,pool] of Object.entries(CARD_POOL)) for (const item of pool) if (item[0]===name) return r;
            for (const [r,pool] of Object.entries(DROP_POOL)) for (const item of pool) if (item[0]===name) return r;
            return '普通';
        }

        // 用户物品堆叠
        function addUserItem(name, desc, count=1) {
            if (count <= 0) return;
            const existing = userData.cards.find(c => c[0] === name);
            if (existing) {
                existing[2] = (existing[2] || 1) + count;
            } else {
                userData.cards.push([name, desc, count]);
            }
        }
        function removeUserItem(name, count=1) {
            const idx = userData.cards.findIndex(c => c[0] === name);
            if (idx === -1) return false;
            const item = userData.cards[idx];
            if (item[2] > count) {
                item[2] -= count;
            } else {
                userData.cards.splice(idx, 1);
            }
            return true;
        }
        function getAllOwnedNames() {
            const names = new Set();
            userData.cards.forEach(c => names.add(c[0]));
            travelerState.backpack.forEach(([n]) => names.add(n));
            return names;
        }

        // ==================== 旅行者状态 ====================
        function updateTravelerState(nowSec = Date.now()/1000) {
            const elapsed = nowSec - (travelerState.lastUpdate || nowSec);
            const hours = Math.min(elapsed / 3600, MAX_OFFLINE_HOURS);
            if (hours <= 0) return;
            travelerState.hunger = Math.max(0, travelerState.hunger - hours * 5);
            travelerState.mood = Math.max(0, travelerState.mood - hours * 2);
            travelerState.temperature = Math.max(-30, travelerState.temperature - hours * 1);
            if (travelerState.hunger < 20) travelerState.health = Math.max(0, travelerState.health - hours * 4);
            travelerState.temperature = clamp(travelerState.temperature, -30, 10);
            travelerState.health = clamp(travelerState.health, 0, 100);
            travelerState.hunger = clamp(travelerState.hunger, 0, 100);
            travelerState.mood = clamp(travelerState.mood, 0, 100);
            travelerState.lastUpdate = nowSec;
        }

        function applyEffect(effect) {
            if (effect.health) travelerState.health = clamp(travelerState.health + effect.health, 0, 100);
            if (effect.hunger) travelerState.hunger = clamp(travelerState.hunger + effect.hunger, 0, 100);
            if (effect.mood) travelerState.mood = clamp(travelerState.mood + effect.mood, 0, 100);
            if (effect.temp) travelerState.temperature = clamp(travelerState.temperature + effect.temp, -30, 10);
        }

        // 智能使用物品（基于阈值）
        function autoUseBackpackItem() {
            const bp = travelerState.backpack;
            if (!bp.length) return null;
            const needs = [
                { stat: 'hunger', threshold: 20, category: 'food' },
                { stat: 'health', threshold: 30, category: 'medical' },
                { stat: 'temperature', threshold: -15, category: 'warm' },
                { stat: 'mood', threshold: 20, category: 'support' },
            ];
            for (const need of needs) {
                if (travelerState[need.stat] < need.threshold) {
                    const idx = bp.findIndex(([name]) => getItemCategory(name) === need.category);
                    if (idx !== -1) {
                        const [itemName] = bp[idx];
                        const effect = getItemEffect(itemName);
                        if (effect) applyEffect(effect);
                        const timeStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Shanghai' });
                        const useText = getTravelerUseText(itemName) || '旅行者使用了物品。';
                        travelerState.log = travelerState.log || [];
                        travelerState.log.push(`${timeStr} ${useText}`);
                        if (travelerState.log.length > 10) travelerState.log = travelerState.log.slice(-10);
                        bp.splice(idx, 1);
                        return useText;
                    }
                }
            }
            return null;
        }

        // ==================== 冒险 ====================
        function refreshAdventure() {
            const nowSec = Date.now() / 1000;
            updateTravelerState(nowSec);
            autoUseBackpackItem();
            adventureState = {
                weather: randChoice(WEATHERS),
                event: randChoice(EVENTS),
                updatedAt: nowSec,
            };
            saveAll();
        }

        function getAdventureReport() {
            const nowSec = Date.now() / 1000;
            updateTravelerState(nowSec);
            if (!adventureState.updatedAt || nowSec - adventureState.updatedAt >= ADVENTURE_REFRESH_SEC) {
                refreshAdventure();
            }
            return {
                weather: adventureState.weather,
                event: adventureState.event,
                updatedAt: adventureState.updatedAt,
                traveler: { ...travelerState },
            };
        }

        // ==================== 打卡与统计 ====================
        function addCheckin(task, duration) {
            const today = getToday();
            userData.checkins[today] = userData.checkins[today] || [];
            userData.checkins[today].push({
                timestamp: Math.floor(Date.now() / 1000),
                task: task || '通用',
                done: true,
                duration: duration || null,
            });
            saveAll();
        }

        function clearTodayCheckins(taskName = null) {
            const today = getToday();
            if (!userData.checkins[today]) return 0;
            if (taskName) {
                const before = userData.checkins[today].length;
                userData.checkins[today] = userData.checkins[today].filter(e => e.task !== taskName);
                return before - userData.checkins[today].length;
            } else {
                const cnt = userData.checkins[today].length;
                delete userData.checkins[today];
                return cnt;
            }
        }

        function calcStats(filterDate = null) {
            const days = Object.keys(userData.checkins).sort();
            if (!days.length) return { total: 0, streak: 0, tasks: {}, totalDurationToday: 0 };
            const today = getToday(), yesterday = getYesterday();
            const dateSet = new Set(days);
            let streak = 0, d = yesterday;
            while (dateSet.has(d)) {
                streak++;
                d = new Date(new Date(d + 'T00:00:00+08:00').getTime() - 86400000).toISOString().slice(0, 10);
            }
            if (dateSet.has(today)) streak++;
            const tasks = {};
            let totalDurationToday = 0;
            const entries = filterDate ? (userData.checkins[filterDate] || []) : Object.values(userData.checkins).flat();
            for (const e of entries) {
                tasks[e.task] = tasks[e.task] || { count: 0, totalDuration: 0 };
                tasks[e.task].count++;
                if (e.duration != null) tasks[e.task].totalDuration += e.duration;
            }
            if (filterDate === getToday()) {
                totalDurationToday = (userData.checkins[getToday()] || []).reduce((s, e) => s + (e.duration || 0), 0);
            }
            return { total: days.length, streak, tasks, totalDurationToday };
        }

        // ==================== 抽卡与掉落 ====================
        function drawCard(ownedNames, preferRarity = null) {
            const allAvailable = [];
            for (const [rarity, pool] of Object.entries(CARD_POOL)) {
                for (const item of pool) {
                    if (!ownedNames.has(item[0])) allAvailable.push({ name: item[0], desc: item[1], rarity });
                }
            }
            if (!allAvailable.length) return null;
            if (preferRarity) {
                const candidates = allAvailable.filter(c => c.rarity === preferRarity);
                if (candidates.length) return randChoice(candidates);
            }
            return randChoice(allAvailable);
        }

        function drawByProbability(ownedNames) {
            const r = Math.random();
            const prefer = r >= 0.95 ? '传说' : r >= 0.7 ? '稀有' : '普通';
            return drawCard(ownedNames, prefer);
        }

        function processDailyDraw() {
            const today = getToday();
            if (!(today in userData.checkins)) return null;
            if (userData.lastDailyDraw === today && !userData.weeklyEggClaimed) return null;
            const streak = calcStats().streak;
            const ownedNames = getAllOwnedNames();
            let card, isExtra = false;
            if (streak >= 7 && userData.weeklyEggClaimed !== today) {
                isExtra = true;
                card = drawCard(ownedNames, '传说');
                if (card) userData.weeklyEggClaimed = today;
            } else {
                card = drawByProbability(ownedNames);
            }
            if (card) {
                addUserItem(card.name, card.desc, 1);
                userData.lastDailyDraw = today;
                return { name: card.name, desc: card.desc, isExtra };
            } else {
                userData.lastDailyDraw = today;
                return null;
            }
        }

        function processDailyDrop() {
            const today = getToday();
            if (userData.dailyDropClaimed === today) return null;
            const dur = calcStats(getToday()).totalDurationToday;
            if (dur <= 0) return null;
            const ownedNames = getAllOwnedNames();
            let pool;
            if (dur >= 120) pool = DROP_POOL['传说'];
            else if (dur >= 60) pool = DROP_POOL['稀有'];
            else pool = DROP_POOL['普通'];
            const available = pool.filter(item => !ownedNames.has(item[0]));
            if (!available.length) return null;
            const drop = randChoice(available);
            addUserItem(drop[0], drop[1], 1);
            userData.dailyDropClaimed = today;
            return { name: drop[0], desc: drop[1] };
        }

        // ==================== 番茄钟模块 ====================
        let tomatoState = {
            totalSeconds: 25 * 60,
            remainingSeconds: 25 * 60,
            elapsedFocusSeconds: 0,
            status: 'idle',
            intervalId: null,
            lastTickTime: null,
            taskName: '番茄钟专注'
        };

        function formatTomatoTime(sec) {
            const m = Math.floor(Math.max(0, sec) / 60), s = Math.floor(Math.max(0, sec) % 60);
            return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        function updateTomatoUI() {
            const display = document.getElementById('tomatoDisplay');
            const startBtn = document.getElementById('btnTomatoStart');
            if (display) display.textContent = formatTomatoTime(tomatoState.remainingSeconds);
            if (startBtn) {
                if (tomatoState.status === 'running') {
                    startBtn.textContent = '⏸ 暂停';
                    startBtn.className = 'btn btn-outline btn-sm';
                } else {
                    startBtn.textContent = '▶ 开始';
                    startBtn.className = 'btn btn-primary btn-sm';
                }
            }
            const stopBtn = document.getElementById('btnTomatoStop');
            if (stopBtn) stopBtn.disabled = (tomatoState.status === 'idle');
        }

        function startTomato() {
            if (tomatoState.status === 'running') { pauseTomato(); return; }
            if (tomatoState.status === 'idle' || tomatoState.status === 'paused') {
                tomatoState.status = 'running';
                tomatoState.lastTickTime = Date.now();
                if (!tomatoState.intervalId) {
                    tomatoState.intervalId = setInterval(tickTomato, 1000);
                }
                updateTomatoUI();
            }
        }

        function pauseTomato() {
            if (tomatoState.status === 'running') {
                tomatoState.elapsedFocusSeconds += (Date.now() - tomatoState.lastTickTime) / 1000;
                tomatoState.status = 'paused';
                updateTomatoUI();
            }
        }

        function stopTomato(record = true) {
            if (tomatoState.status === 'idle') return;
            const now = Date.now();
            if (tomatoState.status === 'running') {
                tomatoState.elapsedFocusSeconds += (now - tomatoState.lastTickTime) / 1000;
            }
            if (record && tomatoState.elapsedFocusSeconds >= 60) {
                const minutes = Math.floor(tomatoState.elapsedFocusSeconds / 60);
                addCheckin(tomatoState.taskName || '番茄钟专注', minutes);
                let msg = `✅ 番茄钟完成！已记录 ${minutes} 分钟专注。`;
                if (minutes >= 15) {
                    const drops = Math.min(Math.floor(minutes / 30) + 1, 4);
                    for (let i = 0; i < drops; i++) {
                        if (minutes < 45) {
                            const owned = getAllOwnedNames();
                            const commonPool = DROP_POOL['普通'].filter(item => !owned.has(item[0]));
                            if (commonPool.length > 0) {
                                const item = randChoice(commonPool);
                                addUserItem(item[0], item[1], 1);
                                msg += ` 🎒 获得【${item[0]}】x1`;
                            }
                        } else {
                            const extra = Math.max(0, minutes - 45);
                            const prob = Math.min(0.1 + extra * 0.03, 0.6);
                            const rarity = Math.random() < prob ? '传说' : '稀有';
                            const pool = DROP_POOL[rarity].filter(item => !getAllOwnedNames().has(item[0]));
                            if (pool.length > 0) {
                                const item = randChoice(pool);
                                addUserItem(item[0], item[1], 1);
                                msg += ` 🎒 获得【${item[0]}】（${rarity}）`;
                            } else {
                                msg += ' （掉落池已空）';
                            }
                        }
                    }
                }
                showToast(msg, 4000);
                saveAll();
                renderPanel('checkin');
                updateTravelerBar();
            } else if (record && tomatoState.elapsedFocusSeconds < 60) {
                showToast('⚠️ 专注时间不足1分钟，未记录打卡。', 2500);
            }
            if (tomatoState.intervalId) { clearInterval(tomatoState.intervalId); tomatoState.intervalId = null; }
            tomatoState.status = 'idle';
            tomatoState.remainingSeconds = tomatoState.totalSeconds;
            tomatoState.elapsedFocusSeconds = 0;
            updateTomatoUI();
        }

        function tickTomato() {
            if (tomatoState.status !== 'running') return;
            const now = Date.now();
            const delta = (now - tomatoState.lastTickTime) / 1000;
            tomatoState.lastTickTime = now;
            tomatoState.remainingSeconds -= delta;
            tomatoState.elapsedFocusSeconds += delta;
            if (tomatoState.remainingSeconds <= 0) {
                tomatoState.remainingSeconds = 0;
                stopTomato(true);
            } else {
                updateTomatoUI();
            }
        }

        function setTomatoPreset(minutes) {
            if (tomatoState.status !== 'idle') return;
            tomatoState.totalSeconds = minutes * 60;
            tomatoState.remainingSeconds = minutes * 60;
            updateTomatoUI();
        }

        // ==================== 赠送 ====================

            const container = document.getElementById('toastContainer');

        }

        function initTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderPanel(btn.dataset.tab);
                });
            });
        }

        function startTickers() {
            setInterval(updateTravelerBar, TICK_INTERVAL_MS);
            setInterval(() => {
                const nowSec = Date.now() / 1000;
                if (adventureState.updatedAt && nowSec - adventureState.updatedAt >= ADVENTURE_REFRESH_SEC) {
                    refreshAdventure();
                }
                updateTravelerState(nowSec);
                saveAll();
            }, 30000);
        }

        function init() {
            updateTravelerState(Date.now() / 1000);
            saveAll();
            initSnowfall();
            initTabs();
            startTickers();
            renderPanel('checkin');
            updateTravelerBar();
            console.log('❄️ 卡卡查克·雪原冒险 已就绪');
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();

        window.addEventListener('beforeunload', () => {
            updateTravelerState(Date.now() / 1000);
            saveAll();
        });
    })();
</script>
</body>
</html>
