<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐸%3C/text%3E%3C/svg%3E">
<title>蛙居小院</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --card:rgba(255,255,255,.045);
  --line:rgba(140,220,170,.14);
  --green:#7fe0a0;
  --text:#d6e8db;
  --muted:#7b9c86;
  --gold:#ffd479;
  --red:#ff8f8f;
}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #1b3527 0%, transparent 70%),
    radial-gradient(800px 400px at 90% 110%, #123024 0%, transparent 70%),
    #08110d;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6;padding:14px;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none!important}
.app{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.topbar{
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:10px 16px;backdrop-filter:blur(8px);
  position:sticky;top:8px;z-index:20;
}
.stat{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.stat .ico{font-size:16px}
.stat.clover{color:var(--green)}
.stat.weather{color:#a9c9ff}
.stat.mood{color:#ff9db3}
.stat.food{color:#9fe0c0;transition:color .4s}
.stat.food.low{color:var(--gold)}
.stat.food.empty{color:var(--red);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.stat.lv{color:var(--gold);margin-left:auto}
.ver{font-size:10.5px;color:#4e6b59;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px;backdrop-filter:blur(8px);
}

.scene{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:320px;text-align:center;gap:6px;position:relative;overflow:hidden;
}
.weather-badge{position:absolute;top:8px;right:14px;font-size:40px;opacity:.18;pointer-events:none}
.frog{
  font-size:60px;line-height:1;filter:drop-shadow(0 8px 22px rgba(80,220,140,.28));
  animation:bob 3s ease-in-out infinite;user-select:none;
  display:flex;align-items:flex-start;gap:2px;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.frog.away{animation:walk 1.1s ease-in-out infinite;filter:drop-shadow(0 8px 22px rgba(140,180,255,.3));display:block}
@keyframes walk{0%,100%{transform:translateX(-7px) rotate(-5deg)}50%{transform:translateX(7px) rotate(5deg)}}
.frog.hungry{filter:drop-shadow(0 8px 22px rgba(255,140,140,.45)) saturate(.7)}
.frog.resting{animation:breathe 4s ease-in-out infinite;filter:drop-shadow(0 8px 22px rgba(255,180,120,.4)) saturate(.85)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.pose-badge{font-size:.55em;line-height:1;margin-top:2px;opacity:.9;filter:none;animation:none}
.scene-text{font-size:15px;font-weight:600;color:#e8f5ec;margin-top:8px}
.scene-sub{font-size:12px;color:var(--muted);min-height:19px}
.scene-sub.warn{color:var(--gold)}
.scene-sub.danger{color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}

button{
  font-family:inherit;font-size:13px;cursor:pointer;
  background:rgba(120,220,160,.1);border:1px solid rgba(120,220,160,.3);
  color:#bff0cf;padding:8px 14px;border-radius:10px;transition:.15s;
}
button:hover:not(:disabled){background:rgba(120,220,160,.2);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
button:disabled{opacity:.28;cursor:not-allowed}

.side-tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.side-tab{background:none;border:none;color:var(--muted);padding:5px 12px;border-radius:8px;font-size:13px}
.side-tab:hover{background:rgba(255,255,255,.04);transform:none}
.side-tab.active{background:rgba(120,220,160,.12);color:var(--green)}

.rate{font-size:12px;color:var(--muted);margin-bottom:10px}
.rate b{color:var(--green);font-size:16px;font-variant-numeric:tabular-nums}
.rate .cost{color:var(--red)}

.up-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;transition:.15s}
.up-item:hover{background:rgba(255,255,255,.03)}
.up-icon{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.up-info{flex:1;min-width:0}
.up-name{font-size:13px;font-weight:600}
.up-lv{color:var(--green);font-size:11px;font-weight:400}
.up-desc{font-size:11px;color:var(--muted)}
.up-buy{font-size:12px;padding:6px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}

#paneLife{max-height:520px;overflow-y:auto;padding-right:4px}
.life-block{margin-bottom:16px}
.life-title{font-size:11px;color:var(--muted);letter-spacing:.14em;margin-bottom:7px;font-weight:600}

.food-row{display:flex;gap:6px}
.food-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 4px;line-height:1.3;
}
.food-btn .f-icon{font-size:19px}
.food-btn .f-name{font-size:11px}
.food-btn .f-val{font-size:10px;color:var(--green)}
.food-btn .f-cost{font-size:10px;color:var(--gold);font-variant-numeric:tabular-nums}

.gear-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;transition:.15s}
.gear-item:hover{background:rgba(255,255,255,.03)}
.gear-icon{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.gear-info{flex:1;min-width:0}
.gear-name{font-size:12.5px;font-weight:600}
.gear-name .tier{font-size:10.5px;color:var(--green);font-weight:400}
.gear-desc{font-size:11px;color:var(--muted)}
.gear-btn{font-size:12px;padding:6px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}

.auto-box{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;
  background:rgba(120,220,160,.05);border:1px solid rgba(120,220,160,.14);
}
.auto-box.on{background:rgba(120,220,160,.11);border-color:rgba(120,220,160,.35)}
.auto-icon{font-size:19px}
.auto-info{flex:1;min-width:0}
.auto-name{font-size:12.5px;font-weight:600}
.auto-desc{font-size:11px;color:var(--muted)}

.bag-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;
}
.bag-slot{
  aspect-ratio:1;border-radius:9px;background:rgba(255,255,255,.025);
  border:1px dashed rgba(140,220,170,.14);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;transition:.15s;
}
.bag-slot.filled{
  background:rgba(120,220,160,.09);
  border:1px solid rgba(120,220,160,.3);
}
.bag-count{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400;letter-spacing:0}

.item-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;transition:.15s}
.item-row:hover{background:rgba(255,255,255,.03)}
.i-icon{font-size:19px;width:26px;text-align:center;flex-shrink:0}
.i-info{flex:1;min-width:0}
.i-name{font-size:12.5px;font-weight:600}
.i-tag{font-size:10.5px;color:var(--muted)}
.i-buy{font-size:12px;padding:6px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:6px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{background:none;border:none;color:var(--muted);padding:5px 12px;border-radius:8px;font-size:13px}
.tab:hover{background:rgba(255,255,255,.04);transform:none}
.tab.active{background:rgba(120,220,160,.12);color:var(--green)}

#logPane{display:flex;flex-direction:column;gap:3px;max-height:280px;overflow-y:auto}
.log-item{font-size:12.5px;color:#a8c4b2;display:flex;gap:8px;padding:2px 0}
.log-time{color:#4e6b59;font-variant-numeric:tabular-nums;flex-shrink:0}
.log-item.good{color:#9fe8b8}
.log-item.bad{color:#e8a0a0}
.log-item.rare{color:var(--gold)}
.log-item.info{color:#93b3c4}

#albumPane{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;
  max-height:440px;overflow-y:auto;padding-right:4px;
}
.pc{
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:12px;padding:10px;
  display:flex;flex-direction:column;gap:6px;transition:.2s;
}
.pc:hover{transform:translateY(-3px);border-color:rgba(140,220,170,.4)}
.pc.rare{border-color:rgba(150,190,255,.5);box-shadow:0 0 16px rgba(120,170,255,.15)}
.pc.legend{border-color:rgba(255,212,121,.6);box-shadow:0 0 20px rgba(255,200,90,.22)}
.pc-top{display:flex;align-items:center;gap:6px}
.pc-emoji{font-size:22px;line-height:1}
.pc-place{font-size:12.5px;font-weight:600;color:#e2f2e8}
.pc-line{font-size:11.5px;color:#93b3a0;line-height:1.55}
.pc-meta{font-size:10.5px;color:#5f7d6a;margin-top:auto;display:flex;justify-content:space-between}
.pc-empty{color:var(--muted);font-size:13px;grid-column:1/-1;text-align:center;padding:28px}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(120,220,160,.2);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="stat clover"><span class="ico">🍀</span><span id="clovers">0</span></div>

    <div id="albumPane" class="hidden"></div>
  </section>

</div>

<script>
/* ============================================================
   版本控制 / 存档键
============================================================ */
const SAVE_KEY       = 'frog_idle_v6';
const SAVE_VERSION   = 7;
const LEGACY_KEYS    = ['frog_idle_v5', 'frog_idle_v4', 'frog_idle_v3', 'frog_idle_v2', 'frog_idle_v1'];

/* ============================================================
   工具
============================================================ */
const BAG_CAP = 8;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rnd = (a,b) => a + Math.random()*(b-a);
const rndInt = (a,b) => Math.floor(rnd(a, b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const $ = s => document.querySelector(s);

function fmt(n){
  const neg = n < 0;
  n = Math.abs(n);
  let out;
  if(n < 1000) out = Math.floor(n).toString();
  else {
    const units = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
    let i = 0;
    while(n >= 1000 && i < units.length-1){ n /= 1000; i++; }
    out = n.toFixed(2) + units[i];
  }
  return (neg ? '-' : '') + out;
}
function fmtDuration(sec){
  sec = Math.floor(sec);
  if(sec < 60) return sec + '秒';
  if(sec < 3600) return Math.floor(sec/60) + '分钟';
  return (sec/3600).toFixed(1) + '小时';
}
function nowStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function dateStr(ts){
  const d = new Date(ts);
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}

/* ============================================================
   天气
============================================================ */
const WEATHERS = {

  cloudy: { name:'多云', icon:'⛅', desc:'云慢吞吞地挪着',         prodMul:1.00, tripMul:1.1, moodTick:+0.15, weight:24 },
  rainy:  { name:'雨',   icon:'🌧️', desc:'雨点敲着屋檐，草长得快', prodMul:1.50, tripMul:0.7, moodTick:-0.40, weight:16 },
  windy:  { name:'风',   icon:'🌬️', desc:'风把蒲公英吹得很远',     prodMul:0.90, tripMul:1.7, moodTick: 0.00, weight:12 },
  foggy:  { name:'雾',   icon:'🌫️', desc:'雾里好像藏着什么',       prodMul:0.85, tripMul:0.6, moodTick:-0.20, weight:10, eventMul:2.2, rareMul:1 },
  snowy:  { name:'雪',   icon:'❄️', desc:'世界安静得只剩落雪声',   prodMul:0.75, tripMul:0.9, moodTick:-0.30, weight:8,  rareMul:2 },
  starry: { name:'星夜', icon:'🌙', desc:'星星很亮，适合许愿',     prodMul:1.15, tripMul:1.3, moodTick:+1.00, weight:7 },
};

/* 在家姿态 */
const POSES = [
  { id:'nap',    icon:'',   text:'小蛙在家，正打着盹。',          min:45, max:130, mood: 0.05, prod: 0,    weight:20 },
  { id:'read',   icon:'📖', text:'小蛙窝在角落里看书，一页一页翻。', min:60, max:160, mood: 0.22, prod:-0.05, weight:16 },
  { id:'farm',   icon:'🌱', text:'小蛙在院子里松土，顺手拔了几根草。', min:60, max:150, mood:-0.06, prod: 0.30, weight:16 },
  { id:'tea',    icon:'🍵', text:'小蛙泡了一壶茶，慢慢喝。',      min:45, max:110, mood: 0.26, prod: 0,    weight:14 },

  { id:'snack',  icon:'🍡', text:'小蛙捧着点心，小口小口地吃。',  min:30, max:80,  mood: 0.35, prod: 0,    weight:10, requireFood:20 },
  { id:'sun',    icon:'🌞', text:'小蛙在窗边晒太阳，眯起了眼睛。', min:60, max:150, mood: 0.35, prod: 0.05, weight:12, weather:'sunny' },
  { id:'cloud',  icon:'☁️', text:'小蛙躺在草地上，看云慢慢变形。', min:50, max:140, mood: 0.18, prod: 0,    weight:12, weather:'cloudy' },

/* 设施 */

const FOODS = [

const ITEMS = [

    use:['小蛙在路边坐下，吃掉了你准备的饭团，米粒还是温的。',

/* ============================================================
   派生数值
============================================================ */
function foodMax(){ return [100, 100, 120, 140][state.gear.food] || 100; }
function foodMul(){ return [1, 1.3, 1.6, 2.0][state.gear.food] || 1; }
function houseMul(){ return [1, 1.08, 1.20, 1.45][state.gear.house] || 1; }
function clothMul(){ return [1, 1, 1.05, 1.12][state.gear.cloth] || 1; }
function clothReduce(){ return [1, 0.8, 0.6, 0.4][state.gear.cloth] || 1; }
function postcardMul(){ return [1, 1.3, 1.6, 2.0][state.gear.travel] || 1; }
function currentPose(){ return POSES.find(x => x.id === state.frog.pose) || POSES[0]; }
function canTrip(){
  return state.frog.home
    && !state.frog.recovering
    && state.mood >= TRIP_NEED_MOOD
    && state.food >= TRIP_NEED_FOOD;
}

function computePerSecond(){
  let base = BASE_RATE;
  for(const u of UPGRADES) base += (state.upgrades[u.id] || 0) * u.rate;
  const w = WEATHERS[state.weather] || WEATHERS.sunny;
  const moodMul = 0.55 + (state.mood / 100) * 0.85;

  let foodMul2 = 1;
  if(state.food <= 0) foodMul2 = 0.35;
  else if(state.food < 30) foodMul2 = 0.7;

  let poseProd = 1;
  if(state.frog.home && !state.frog.recovering){
    const p = currentPose();
    poseProd = 1 + (p.prod || 0);
  }

  return base * w.prodMul * moodMul * houseMul() * clothMul() * foodMul2 * poseProd;
}
function autoCostPerSec(){
  return (state.hasAutoFeeder && state.autoFeed && state.frog.home && state.food < foodMax())
    ? AUTO_FEEDER_RATE : 0;
}
function upgradeCost(u){
  const n = state.upgrades[u.id] || 0;
  return Math.floor(u.base * Math.pow(1.18, n));
}

============================================================ */
function addLog(text, type){
  state.logs.unshift({ time: nowStr(), text, type: type || '' });
  if(state.logs.length > 80) state.logs.length = 80;
  state.logSeq++;
}

/* ============================================================
   天气
============================================================ */
function changeWeather(){
  const keys = Object.keys(WEATHERS).filter(k => k !== state.weather);
  let total = 0;
  for(const k of keys) total += WEATHERS[k].weight;
  let r = Math.random() * total;
  for(const k of keys){
    r -= WEATHERS[k].weight;
    if(r <= 0){ state.weather = k; break; }
  }
  state.weatherTimer = rnd(90, 240);
  const w = WEATHERS[state.weather];
  addLog(`天气变成了「${w.name}」。${w.desc}。`, 'info');
}

/* ============================================================
   在家姿态
============================================================ */
function pickPose(){
  const f = state.frog;
  const w = state.weather;

  const usable = POSES.filter(p => {
    if(p.weather && p.weather !== w) return false;
    if(p.requireFood && state.food < p.requireFood) return false;
    return true;
  });

  const weatherPoses = usable.filter(p => p.weather);
  const commonPoses  = usable.filter(p => !p.weather);

  let pool;
  if(weatherPoses.length && Math.random() < 0.3) pool = weatherPoses;
  else pool = commonPoses.length ? commonPoses : usable;

  let total = 0;
  for(const p of pool) total += p.weight;
  let r = Math.random() * total;
  let chosen = pool[0];
  for(const p of pool){
    r -= p.weight;
    if(r <= 0){ chosen = p; break; }
  }

  f.pose = chosen.id;
  f.poseTimer = rnd(chosen.min, chosen.max);
}

/* ============================================================
   旅行
============================================================ */
function nextTripEventDelay(){
  const exp = -Math.log(1 - Math.random()) * 1200;
  return 300 + Math.min(exp, 2400);
}
function rollTripDuration(){
  return rnd(600, 7200);
}

function startTrip(){
  const f = state.frog;
  if(!canTrip()) return;

  const place = pick(PLACES);
  const dur = rollTripDuration();

  f.home = false;
  f.place = place;
  f.duration = dur;
  f.remain = dur;
  f.events = [];
  f.eventTimer = nextTripEventDelay();
  f.bag = state.bag.slice();
  f.recovering = false;
  f.recoverTimer = 0;
  state.bag = [];

  addLog(`小蛙背上行囊，往「${place.name}」去了。`, 'info');
  if(f.bag.length){
    addLog('它带走了：' + f.bag.map(i => i.icon + i.name).join('、') + '。', 'info');
  }
}

function tripEvent(){
  const f = state.frog;
  if(!f.bag || !f.bag.length){
    const e = pick(TRIP_EVENTS);
    if(!f.events.includes(e) && f.events.length < 6) f.events.push(e);
    addLog('旅途中：' + e, 'info');
    return;
  }

  const w = state.weather;
  const bag = f.bag;
  const pool = [];
  for(const it of bag){
    if(it.type === 'cloth' && it.weather === w){ pool.push(it, it, it); }
    else if(it.type === 'food'){ pool.push(it, it); }
    else if(it.type === 'gift'){ pool.push(it); }
    else { pool.push(it); }
  }
  const item = pick(pool);
  const idx = bag.indexOf(item);
  if(idx >= 0) bag.splice(idx, 1);

  const text = pick(item.use);
  addLog('旅途中：' + text, 'good');
}

function endTrip(interrupted){
  const f = state.frog;
  if(f.home) return;

  const place = f.place;
  const dur = f.duration;

  let n = rndInt(1, 2) + (Math.random() < 0.35 ? 1 : 0);
  n = Math.max(1, Math.round(n * postcardMul()));
  if(interrupted) n = Math.max(1, Math.floor(n / 2));
  for(let i = 0; i < n; i++){
    state.postcards.unshift(makePostcard());
    state.pcSeq++;
  }
  if(state.postcards.length > 200) state.postcards.length = 200;

  let reward = state.perSecond * dur * 0.8 + 8 * state.level;
  if(interrupted) reward *= 0.35;
  state.clovers += reward;
  state.totalClovers += reward;

  if(interrupted){
    addLog(`小蛙玩够了，从「${place.name}」提前回来了。它想在家歇一会儿。`, 'info');
    state.mood = clamp(state.mood + 3, 0, 100);
    f.recovering = true;
    f.recoverTimer = RECOVER_TIME;
  } else {
    const moodBack = [18, 18, 23, 28][state.gear.travel] || 18;
    state.mood = clamp(state.mood + moodBack, 0, 100);
    addLog(`小蛙从「${place.name}」回来了，带回 ${n} 张明信片和 ${fmt(reward)} 🍀。`, 'good');
  }
  state.stats.trips++;

  if(f.bag && f.bag.length){
    let back = 0;
    for(const item of f.bag){
      if(state.bag.length < BAG_CAP){ state.bag.push(item); back++; }
    }
    if(back > 0) addLog(`小蛙把没用完的 ${back} 件东西放回了行囊。`, 'info');
  }

  f.home = true;
  f.remain = 0;
  f.place = null;
  f.events = [];
  f.bag = [];
  f.autoTimer = rnd(180, 360);
  f.poseTimer = rnd(3, 12);
}

function makePostcard(){
  const p = pick(PLACES);
  const w = WEATHERS[state.weather];
  let rarity = 'common';
  const roll = Math.random() / (1 + (w.rareMul || 0) * 0.6);
  if(roll < 0.025) rarity = 'legend';
  else if(roll < 0.14) rarity = 'rare';

  return {
    id: 'pc' + Date.now() + Math.random().toString(36).slice(2,7),
    place: p.name,
    emoji: p.emoji,
    line: pick(p.lines),
    weather: state.weather,
    date: Date.now(),
    rarity
  };
}

/* ============================================================
   随机事件
============================================================ */
function homeEvent(){
  const e = pick(HOME_EVENTS);
  const r = state.perSecond;
  const parts = [];
  let bad = false;

  if(e.clover){
    const v = Math.floor(e.clover(r));
    state.clovers = Math.max(0, state.clovers + v);
    if(v > 0){ state.totalClovers += v; parts.push('+' + fmt(v) + ' 🍀'); }
    else { bad = true; parts.push(fmt(v) + ' 🍀'); }
  }
  if(e.mood){
    state.mood = clamp(state.mood + e.mood, 0, 100);
    parts.push((e.mood > 0 ? '+' : '') + e.mood + ' 心情');
  }
  if(e.food){
    const max = foodMax();
    state.food = clamp(state.food + e.food * foodMul(), 0, max);
    parts.push('+' + Math.round(e.food * foodMul()) + ' 饱食');
  }
  if(e.postcard){
    state.postcards.unshift(makePostcard());
    state.pcSeq++;
    parts.push('获得一张明信片');
  }

  addLog(e.text + (parts.length ? `（${parts.join('，')}）` : ''), bad ? 'bad' : 'good');
  state.stats.events++;
}

/* ============================================================
   主循环
============================================================ */
function tick(dt){
  state.perSecond = computePerSecond();
  const autoCost = autoCostPerSec();
  state.autoCost = autoCost;

  state.clovers += (state.perSecond - autoCost) * dt;
  if(state.perSecond > 0) state.totalClovers += state.perSecond * dt;
  if(state.clovers < 0) state.clovers = 0;

  const w = WEATHERS[state.weather];
  let moodTick = w.moodTick;
  if(moodTick < 0) moodTick *= clothReduce();

  const f = state.frog;

  if(f.home){
    if(autoCost > 0){
      const max = foodMax();
      state.food = Math.min(max, state.food + AUTO_FEEDER_FOOD * dt);
    }

    state.food = Math.max(0, state.food - FOOD_TICK * dt);

    if(state.food <= 0) moodTick -= 1.6;
    else if(state.food < 30) moodTick -= 0.5;

    if(f.recovering){
      f.recoverTimer -= dt;
      state.mood = clamp(state.mood + RECOVER_MOOD_RATE * dt, 0, 100);
      if(state.food < TRIP_NEED_FOOD){
        state.food = Math.min(TRIP_NEED_FOOD, state.food + RECOVER_FOOD_RATE * dt);
      }
      if(f.recoverTimer <= 0){
        f.recovering = false;
        f.recoverTimer = 0;
        addLog('小蛙休息好了，又活蹦乱跳起来。', 'good');
      }
    } else {
      if(state.mood < 30) moodTick += HOME_RECOVER_MOOD;
      if(state.food < 20){
        state.food = Math.min(foodMax(), state.food + HOME_RECOVER_FOOD * dt);
      }

      const p = currentPose();
      if(p.mood) moodTick += p.mood;
      if(p.postcard && Math.random() < p.postcard * dt){
        state.postcards.unshift(makePostcard());
        state.pcSeq++;
        if(state.postcards.length > 200) state.postcards.length = 200;
        addLog('小蛙写完一封信，顺手画了一张风景，夹进了相册。', 'rare');
      }
    }
  } else {
    state.food = Math.max(0, state.food - TRIP_FOOD_TICK * dt);

    let tripMoodTick = -TRIP_MOOD_TICK;
    if(w.moodTick > 0) tripMoodTick = w.moodTick * 0.3;
    state.mood = clamp(state.mood + tripMoodTick * dt, 0, 100);

    if(state.mood <= 0 || state.food <= 0){
      endTrip(true);
    }
  }
  state.mood = clamp(state.mood + moodTick * dt, 0, 100);

  state.weatherTimer -= dt;
  if(state.weatherTimer <= 0) changeWeather();

  tickFrog(dt);

  state.eventTimer -= dt;
  if(state.eventTimer <= 0){
    state.eventTimer = rnd(25, 60) / (w.eventMul || 1);
    if(Math.random() < 0.7 && state.frog.home && !state.frog.recovering) homeEvent();
  }

  const newLv = 1 + Math.floor(Math.sqrt(state.totalClovers / 200));
  if(newLv > state.level){
    state.level = newLv;
    addLog(`小院成长到了 Lv.${newLv}！`, 'good');
  }

  if(patCd > 0) patCd -= dt;

  saveTimer -= dt;
  if(saveTimer <= 0){ saveTimer = 10; save(); }
}

function tickFrog(dt){
  const f = state.frog;
  if(f.home){
    if(f.recovering){
      f.pose = 'recover';
      f.poseTimer = 99999;
    } else {
      f.poseTimer -= dt;
      if(f.poseTimer <= 0) pickPose();
    }

    f.autoTimer -= dt;
    if(f.autoTimer <= 0){
      f.autoTimer = rnd(180, 400);
      if(canTrip()) startTrip();
    }
  } else {
    f.remain -= dt;
    f.eventTimer -= dt;
    if(f.eventTimer <= 0){
      f.eventTimer = nextTripEventDelay();
      tripEvent();
    }
    if(f.remain <= 0) endTrip(false);
  }
}

function loop(){
  const now = Date.now();
  let dt = (now - lastTick) / 1000;
  lastTick = now;

  if(dt > MAX_TICK) dt = MAX_TICK;
  if(dt > 0.05) tick(dt);
  render();
}

/* ============================================================
   操作
============================================================ */
function buy(id){
  const u = UPGRADES.find(x => x.id === id);
  if(!u) return;
  const cost = upgradeCost(u);
  if(state.clovers < cost) return;
  state.clovers -= cost;
  state.upgrades[id] = (state.upgrades[id] || 0) + 1;
  state.perSecond = computePerSecond();
  addLog('升级了「' + u.name + '」到 Lv.' + state.upgrades[id] + '。', 'good');
}

function eat(foodId){
  const f = FOODS.find(x => x.id === foodId);
  if(!f) return;
  if(!state.frog.home) return;
  const max = foodMax();
  if(state.food >= max - 0.01) return;
  if(state.clovers < f.cost) return;

  state.clovers -= f.cost;
  const gain = f.food * foodMul();
  state.food = clamp(state.food + gain, 0, max);
  if(f.mood) state.mood = clamp(state.mood + f.mood, 0, 100);
  state.stats.fed++;

  let msg = `你喂了小蛙一份${f.name}，饱食度 +${Math.round(gain)}。`;
  if(f.mood) msg += ` 心情 +${f.mood}。`;
  addLog(msg, 'good');
}

function buyItem(id){
  const item = ITEMS.find(i => i.id === id);
  if(!item) return;
  if(state.bag.length >= BAG_CAP) return;
  if(state.clovers < item.cost) return;
  state.clovers -= item.cost;
  state.bag.push({
    id: item.id, name: item.name, icon: item.icon,
    type: item.type, weather: item.weather, use: item.use
  });
  addLog(`你把${item.icon}${item.name}放进了行囊。`, 'info');
}

function buyGear(gearId){
  const g = GEAR.find(x => x.id === gearId);
  if(!g) return;
  const lv = state.gear[gearId] || 0;
  if(lv >= g.items.length) return;
  const item = g.items[lv];
  if(state.clovers < item.cost) return;

  state.clovers -= item.cost;
  state.gear[gearId] = lv + 1;
  addLog(`置办了「${item.name}」（${g.name}）。${item.desc}。`, 'good');
}

function buyAutoFeeder(){
  if(state.hasAutoFeeder) return;
  if(state.clovers < AUTO_FEEDER_COST) return;
  state.clovers -= AUTO_FEEDER_COST;
  state.hasAutoFeeder = true;
  state.autoFeed = true;
  addLog('你装好了自动喂食器。它会持续消耗三叶草，维持小蛙的饱食度。', 'good');
}

function toggleAutoFeed(){
  if(!state.hasAutoFeeder) return;
  state.autoFeed = !state.autoFeed;
  addLog('自动喂食器已' + (state.autoFeed ? '开启' : '关闭') + '。', 'info');
}

   渲染
============================================================ */
function render(){
  const foodMaxV = foodMax();
  $('#clovers').textContent = fmt(state.clovers);
  $('#ps').textContent = fmt(state.perSecond);
  $('#mood').textContent = Math.round(state.mood);
  $('#level').textContent = state.level;

  const foodEl = $('#food');
  foodEl.textContent = Math.round(state.food) + '/' + foodMaxV;
  const fStat = $('#foodStat');
  fStat.classList.remove('low','empty');
  if(state.food <= 0.5) fStat.classList.add('empty');
  else if(state.food < 30) fStat.classList.add('low');

  const w = WEATHERS[state.weather];
  $('#wicon').textContent = w.icon;
  $('#wname').textContent = w.name;
  $('#weatherBadge').textContent = w.icon;

  const cost = state.autoCost;
  $('#netHint').innerHTML = cost > 0
    ? ` <span class="cost">(-${fmt(cost)} 喂食)</span>`
    : '';

  renderScene();
  updateShop();
  updateLife();
  updateBag();

  if(state.logSeq !== lastLogSeq){ lastLogSeq = state.logSeq; renderLogs(); }
  if(state.pcSeq !== lastPcSeq){ lastPcSeq = state.pcSeq; renderAlbum(); }

  const away = !state.frog.home;
  $('#btnPat').disabled = away || patCd > 0;
  $('#btnFeed').disabled = away || state.clovers < 50 || state.mood >= 100;

  const tripBtn = $('#btnTrip');
  tripBtn.disabled = !canTrip();
  if(away) tripBtn.title = '小蛙已经出门了';
  else if(state.frog.recovering) tripBtn.title = '小蛙需要休息一下';
  else if(!canTrip()) tripBtn.title = '小蛙需要恢复一下（心情 ≥ 40，饱食 ≥ 30）';
  else tripBtn.title = '';
}

function renderScene(){
  const f = state.frog;
  const el = $('#frog');
  const w = WEATHERS[state.weather];
  const sub = $('#sceneSub');
  sub.classList.remove('warn','danger');
  el.classList.remove('hungry','away','resting');

  if(f.home){
    if(f.recovering){
      el.innerHTML = '<span>🐸</span><span class="pose-badge">' + RECOVER_POSE.icon + '</span>';
      el.classList.add('resting');
      $('#sceneText').textContent = RECOVER_POSE.text;
      sub.textContent = '还需要 ' + Math.ceil(f.recoverTimer) + ' 秒才能出门';
      sub.classList.add('warn');
      return;
    }

    const hungry = state.food <= 0.5;
    const low = state.food < 30;

    if(hungry || low){
      el.innerHTML = '<span>🐸</span>';
      el.classList.add('hungry');

      if(hungry){
        $('#sceneText').textContent = '小蛙饿得没力气了……';
        sub.textContent = '快喂点东西吧';
        sub.classList.add('danger');
      } else {
        $('#sceneText').textContent = '小蛙肚子咕咕叫。';
        sub.textContent = '产出变慢了，喂点吃的吧';
        sub.classList.add('warn');
      }
    } else {
      const p = currentPose();
      el.innerHTML = '<span>🐸</span>' +
        (p.icon ? '<span class="pose-badge">' + p.icon + '</span>' : '');
      $('#sceneText').textContent = p.text;
      sub.textContent = w.name + ' · ' + w.desc;
    }
  } else {
    el.textContent = '🎒';
    el.classList.add('away');
    $('#sceneText').textContent = '小蛙去了「' + f.place.name + '」';
    const n = f.bag ? f.bag.length : 0;
    let subText = n > 0
      ? '不知道什么时候回来…… 行囊里还有 ' + n + ' 件东西'
      : '不知道什么时候回来……';
    if(state.mood < 25 || state.food < 25){
      subText = '小蛙好像有点累了……';
      sub.classList.add('warn');
    }
    sub.textContent = subText;
  }
}

  for(const u of UPGRADES){
    const el = document.createElement('div');
    el.className = 'up-item';
    el.innerHTML =
      '<div class="up-icon">' + u.icon + '</div>' +
      '<div class="up-info">' +
        '<div class="up-name">' + u.name + ' <span class="up-lv">Lv.0</span></div>' +
        '<div class="up-desc">' + u.desc + '</div>' +
      '</div>' +
      '<button class="up-buy">🍀 <span>0</span></button>';
    el.querySelector('.up-buy').addEventListener('click', () => buy(u.id));
    list.appendChild(el);
    u._el = el;
  }
}
function updateShop(){
  for(const u of UPGRADES){
    if(!u._el) continue;
    const n = state.upgrades[u.id] || 0;
    const cost = upgradeCost(u);
    u._el.querySelector('.up-lv').textContent = 'Lv.' + n;
    const btn = u._el.querySelector('.up-buy');
    btn.querySelector('span').textContent = fmt(cost);
    btn.disabled = state.clovers < cost;
  }
}

        '<div class="i-name">' + item.name + '</div>' +

        '<div class="gear-name"><span class="g-title"></span></div>' +
        '<div class="gear-desc"></div>' +

function updateLife(){
  const max = foodMax();

  for(const f of FOODS){
    if(!f._el) continue;
    const full = state.food >= max - 0.01;
    f._el.disabled = !state.frog.home || full || state.clovers < f.cost;
    f._el.querySelector('.f-val').textContent = '+' + Math.round(f.food * foodMul()) + ' 饱食';
    f._el.querySelector('.f-cost').textContent = '🍀 ' + f.cost;
  }

  const box = $('#autoBox');
  const btn = $('#autoBtn');
  const nameEl = $('#autoName');
  const descEl = $('#autoDesc');
  if(box){
    box.classList.toggle('on', state.hasAutoFeeder && state.autoFeed);
    if(!state.hasAutoFeeder){
      nameEl.textContent = '自动喂食器';
      descEl.textContent = `在家时每秒消耗 ${AUTO_FEEDER_RATE} 🍀，自动补充饱食度`;
      btn.textContent = '🍀 ' + fmt(AUTO_FEEDER_COST);
      btn.disabled = state.clovers < AUTO_FEEDER_COST;
    } else {
      nameEl.textContent = '自动喂食器 · 已安装';
      if(state.autoFeed){
        descEl.textContent = state.frog.home
          ? `运行中：-${AUTO_FEEDER_RATE} 🍀/秒 → +${AUTO_FEEDER_FOOD} 饱食/秒`
          : '小蛙出门了，喂食器暂停工作';
      } else {
        descEl.textContent = '已关闭，不再消耗三叶草';
      }
      btn.textContent = state.autoFeed ? '关闭' : '开启';
      btn.disabled = false;
    }
  }

  for(const g of GEAR){
    if(!g._el) continue;
    const lv = state.gear[g.id] || 0;
    const titleEl = g._el.querySelector('.g-title');
    const descEl2 = g._el.querySelector('.gear-desc');
    const btn2 = g._el.querySelector('.gear-btn');

    if(lv > 0){
      titleEl.innerHTML = g.items[lv-1].name + ' <span class="tier">Lv.' + lv + '</span>';
    } else {
      titleEl.textContent = g.name + ' · 尚未置办';
    }

    if(lv >= g.items.length){
      descEl2.textContent = '已满级';
      btn2.textContent = '已满级';
      btn2.disabled = true;
    } else {
      const next = g.items[lv];
      descEl2.textContent = '下一件：' + next.name + ' — ' + next.desc;
      btn2.textContent = '🍀 ' + fmt(next.cost);
      btn2.disabled = state.clovers < next.cost;
    }
  }
}

/* ============================================================
   存档 / 版本迁移
============================================================ */
function save(){
  state.version = SAVE_VERSION;
  state.lastSave = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){}
}

/* 把旧版本的数据补齐到当前结构 */
function migrateSave(data){
  const from = Number(data.version) || 1;

  /* v1 → v2：饱食度、自动喂食器 */
  if(from < 2){
    if(typeof data.food !== 'number') data.food = 100;
    if(typeof data.hasAutoFeeder !== 'boolean') data.hasAutoFeeder = false;
    if(typeof data.autoFeed !== 'boolean') data.autoFeed = false;
  }

  /* v2 → v3：行囊、装备 */
  if(from < 3){
    if(!Array.isArray(data.bag)) data.bag = [];
    if(!data.gear) data.gear = { cloth:0, food:0, house:0, travel:0 };
  }

  /* v3 → v4：姿态 */
  if(from < 4){
    if(!data.frog) data.frog = {};
    if(!data.frog.pose) data.frog.pose = 'nap';
    if(typeof data.frog.poseTimer !== 'number') data.frog.poseTimer = 60;
    if(!Array.isArray(data.frog.bag)) data.frog.bag = [];
  }

  /* v4 → v5：移除任务系统 */
  if(from < 5){
    delete data.task;
  }

  /* v5 → v6：恢复期 */
  if(from < 6){
    if(!data.frog) data.frog = {};
    if(typeof data.frog.recovering !== 'boolean') data.frog.recovering = false;
    if(typeof data.frog.recoverTimer !== 'number') data.frog.recoverTimer = 0;
  }

  /* v6 → v7：明信片文案更新，只是加版本号，结构不变 */
  if(from < 7){
    /* nothing structural */
  }

  data.version = SAVE_VERSION;
  return data;
}

function load(){
  try {
    /* 先读当前 key，读不到再按顺序尝试旧 key */
    let raw = localStorage.getItem(SAVE_KEY);
    let fromKey = SAVE_KEY;
    if(!raw){
      for(const k of LEGACY_KEYS){
        const v = localStorage.getItem(k);
        if(v){ raw = v; fromKey = k; break; }
      }
    }
    if(!raw) return false;

    let data = JSON.parse(raw);
    const originalVersion = Number(data.version) || 1;

    data = migrateSave(data);

    state = Object.assign(defaultState(), data);
    state.frog = Object.assign(defaultState().frog, data.frog || {});
    state.gear = Object.assign({ cloth:0, food:0, house:0, travel:0 }, data.gear || {});
    state.stats = Object.assign({ trips:0, events:0, fed:0 }, data.stats || {});

    if(!Array.isArray(state.bag)) state.bag = [];
    if(!Array.isArray(state.logs)) state.logs = [];
    if(!Array.isArray(state.postcards)) state.postcards = [];
    if(!Array.isArray(state.frog.bag)) state.frog.bag = [];
    if(!state.frog.pose || !POSES.find(p => p.id === state.frog.pose)){
      state.frog.pose = 'nap';
      state.frog.poseTimer = 60;
    }

    /* 从旧 key 迁移过来时，写回新 key，并清掉旧的 */
    if(fromKey !== SAVE_KEY){
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){}
      try { localStorage.removeItem(fromKey); } catch(e){}
      state._migratedFrom = fromKey;
      state._migratedVersion = originalVersion;
    } else if(originalVersion < SAVE_VERSION){
      state._migratedVersion = originalVersion;
    }

    return true;
  } catch(e){
    state = defaultState();
    return false;
  }
}

function applyOffline(){
  const now = Date.now();
  const dt = (now - (state.lastSave || now)) / 1000;
  if(dt < 60) return;

  const capped = Math.min(dt, 8 * 3600);
  const gain = state.perSecond * capped * 0.5;
  state.clovers += gain;
  state.totalClovers += gain;

  const f = state.frog;

  if(f.home){
    if(f.recovering){
      f.recoverTimer -= capped;
      state.mood = clamp(state.mood + RECOVER_MOOD_RATE * capped, 0, 100);
      if(state.food < TRIP_NEED_FOOD){
        state.food = Math.min(TRIP_NEED_FOOD, state.food + RECOVER_FOOD_RATE * capped);
      }
      if(f.recoverTimer <= 0){
        f.recovering = false;
        f.recoverTimer = 0;
      }
    } else {
      if(!(state.hasAutoFeeder && state.autoFeed)){
        state.food = Math.max(20, state.food - FOOD_TICK * capped * 0.35);
      }
    }
    f.poseTimer = rnd(3, 12);
  } else {
    f.remain -= capped;
    state.food = Math.max(0, state.food - TRIP_FOOD_TICK * capped);
    const w = WEATHERS[state.weather];
    let tripMoodTick = -TRIP_MOOD_TICK;
    if(w.moodTick > 0) tripMoodTick = w.moodTick * 0.3;
    state.mood = clamp(state.mood + tripMoodTick * capped, 0, 100);

    if(f.remain <= 0){
      endTrip(false);
    } else if(state.mood <= 0 || state.food <= 0){
      endTrip(true);
    }
  }

  addLog('你离开了 ' + fmtDuration(dt) + '，小院自己长了 ' + fmt(gain) + ' 🍀。', 'good');
}

/* ============================================================
   初始化
============================================================ */
function bindUI(){
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      const tab = t.dataset.tab;
      $('#logPane').classList.toggle('hidden', tab !== 'log');
      $('#albumPane').classList.toggle('hidden', tab !== 'album');
    });
  });

  document.querySelectorAll('.side-tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.side-tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      const pane = t.dataset.pane;
      $('#paneFacility').classList.toggle('hidden', pane !== 'facility');
      $('#paneLife').classList.toggle('hidden', pane !== 'life');
    });
  });

  $('#btnPat').addEventListener('click', () => {
    if(!state.frog.home || patCd > 0) return;
    patCd = 3;
    state.mood = clamp(state.mood + 5, 0, 100);
    addLog('你摸了摸小蛙的头，它没有躲。', 'good');
  });

  $('#btnFeed').addEventListener('click', () => {
    if(!state.frog.home) return;
    if(state.clovers < 50 || state.mood >= 100) return;
    state.clovers -= 50;
    state.mood = clamp(state.mood + 18, 0, 100);
    addLog('你喂了小蛙一块点心，它眯起了眼睛。', 'good');
  });

  $('#btnTrip').addEventListener('click', () => {
    if(!canTrip()) return;
    startTrip();
  });

  document.addEventListener('visibilitychange', () => {
    if(document.hidden) save();
    else loop();
  });
  window.addEventListener('beforeunload', save);
}

function init(){
  const isNew = !load();

  for(const u of UPGRADES){
    if(state.upgrades[u.id] == null) state.upgrades[u.id] = 0;
  }
  if(!state.logSeq) state.logSeq = state.logs.length;
  if(!state.pcSeq) state.pcSeq = state.postcards.length;
  state.food = clamp(state.food, 0, foodMax());

  if(!state.frog.pose || !POSES.find(p => p.id === state.frog.pose)){
    state.frog.pose = 'nap';
    state.frog.poseTimer = 60;
  }

  state.perSecond = computePerSecond();
  applyOffline();

  /* 顶栏版本标记 */
  const verTag = $('#verTag');
  if(verTag){
    verTag.textContent = 'v' + SAVE_VERSION;
    verTag.title = '存档版本 v' + SAVE_VERSION;
  }

  buildShop();
  buildLife();
  bindUI();

  if(isNew){
    addLog('欢迎来到蛙居小院。小院会自己长出三叶草，小蛙会出门旅行。', 'good');
    addLog('出门在外它会自己照顾自己，玩够了就回家歇歇。', 'info');
  } else if(state._migratedFrom){
    addLog('从旧存档（' + state._migratedFrom + '）迁移到 v' + SAVE_VERSION + ' 完成。', 'info');
  } else if(state._migratedVersion && state._migratedVersion < SAVE_VERSION){
    addLog('存档已升级：v' + state._migratedVersion + ' → v' + SAVE_VERSION + '。', 'info');
  } else {
    addLog('小蛙抬起头看了你一眼。', 'info');
  }
  delete state._migratedFrom;
  delete state._migratedVersion;

  lastTick = Date.now();
  render();
  setInterval(loop, 250);
}

init();
</script>
