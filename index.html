<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>卡卡查克 · 雪原冒险</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
    <style>
        :root {
            --bg-color: #0a0e17;
            --bg-gradient: radial-gradient(ellipse at 50% 0%, #1a2a3a 0%, #0a0e17 70%);
            --text: #d0d8e8;
            --text2: #94a3b8;
            --accent: #5eb0e5;
            --gold: #f0c060;
            --rare: #7eb8da;
            --legend: #f0b830;
            --success: #5cb878;
            --warm: #e89050;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px #00000055;
            --transition: 0.25s ease;
            
            /* 磨砂面板变量（纯半透明，无模糊） */
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: var(--bg-gradient);
            background-attachment: fixed;
        }

        .snowfall { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .snowflake { position: absolute; top: -60px; color: #c8ddf8; font-size: 1rem; animation: fall linear infinite; opacity: 0.7; text-shadow: 0 0 6px #b0d0f8; }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.9; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(-15px); opacity: 0.15; }
        }

        .app-container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }
        .header { text-align: center; padding: 18px 10px 8px; z-index: 2; }
        .header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #d0e8ff, #7eb8da); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 2px; }
        .header .subtitle { font-size: 0.85rem; color: var(--text2); }

        .btn { padding: 9px 18px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 0.88rem; border: none; transition: var(--transition); letter-spacing: 0.03em; white-space: nowrap; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 10px #3a7bd544; }
        .btn-primary:hover { background: #6ec0f0; box-shadow: 0 4px 16px #3a7bd566; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--accent); color: #fff; }
        .btn-sm { padding: 5px 12px; font-size: 0.78rem; border-radius: 16px; }
        .btn-gold { background: linear-gradient(135deg, #c89030, #e0b050); color: #1a0e00; font-weight: 700; box-shadow: 0 2px 12px #e0b04044; }
        .btn-gold:hover { box-shadow: 0 4px 20px #e0b04066; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }

        .main-layout { display: flex; align-items: flex-start; gap: 16px; z-index: 2; margin-top: 8px; }
        .sidebar { width: 150px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; z-index: 2; }

        .traveler-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            align-items: center;
            justify-content: flex-start;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 8px 10px;
            box-shadow: var(--glass-shadow), var(--glass-highlight);
            margin: 0;
        }
        .traveler-bar .stat { display: flex; align-items: center; gap: 3px; font-size: 0.75rem; white-space: nowrap; }
        .traveler-bar .stat .icon { font-size: 1.0rem; }
        .traveler-bar .stat .val { font-weight: 600; min-width: 24px; text-align: center; }
        .stat-bar-wrap {
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            overflow: hidden;
        }
        .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        .fill-temp { background: linear-gradient(90deg, #4a90d9, #e89050); }
        .fill-health { background: linear-gradient(90deg, #e05555, #5cb878); }
        .fill-hunger { background: linear-gradient(90deg, #c09040, #f0c060); }
        .fill-mood { background: linear-gradient(90deg, #7eb8da, #d0a0e0); }

        .tab-nav { display: flex; flex-direction: column; gap: 4px; width: 100%; }
        .tab-btn {
            justify-content: flex-start;
            padding: 9px 12px;
            width: 100%;
            text-align: left;
            font-size: 0.82rem;
            border-radius: 22px;
            border: 1px solid transparent;
            cursor: pointer;
            font-weight: 500;
            background: var(--glass-bg);
            

            color: var(--text2);
            transition: var(--transition);
            white-space: nowrap;
        }
        .tab-btn:hover {
            border-color: var(--glass-border);
            background: rgba(255, 255, 255, 0.12);
            color: var(--text);
        }
        .tab-btn.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 12px #3a7bd544;
        }
        .panel-area {
            flex: 1;
            height: 560px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 4px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow), var(--glass-highlight);
            min-width: 0;
        }

        .panel { padding: 18px 20px; animation: fadeIn 0.35s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .panel h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .panel h3 .icon { font-size: 1.2rem; }

        .input-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        .input-row input {
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
            flex: 1;
            min-width: 120px;
        }
        .input-row input:focus { border-color: var(--accent); box-shadow: 0 0 8px #3a7bd533; }
        .input-row input.dur-input { flex: 0 0 90px; min-width: 70px; }

        .checkin-list { list-style: none; padding-right: 4px; }
        .checkin-list li {
            padding: 7px 0;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .checkin-list .task-name { color: var(--text); flex: 1; }
        .checkin-list .task-dur { color: var(--accent); font-weight: 600; white-space: nowrap; }
        .checkin-list .task-time { color: var(--text2); font-size: 0.75rem; white-space: nowrap; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; padding-right: 4px; }
        .card-item {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 12px;
            cursor: default;
            transition: var(--transition);
            position: relative;
        }
        .card-item:hover { border-color: #4a6a90; box-shadow: 0 2px 12px #00000044; }
        .card-item.rare { border-color: #3a6a90; box-shadow: 0 0 10px #3a7bd522; }
        .card-item.legend { border-color: #8a6a20; box-shadow: 0 0 16px #e0b04033; background: #141008; }
        .card-item .card-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .card-item.rare .card-name { color: #8ec8f0; }
        .card-item.legend .card-name { color: #f0c040; }
        .card-item .card-desc { font-size: 0.75rem; color: var(--text2); line-height: 1.35; margin-bottom: 8px; }
        .card-item .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .card-count { display: inline-block; background: #5eb0e533; color: #b0d8f8; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; margin-left: 4px; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
        .badge-common { background: #2a3a50; color: #a0b0c0; }
        .badge-rare { background: #1a3a50; color: #7eb8da; }
        .badge-legend { background: #3a2a10; color: #f0c040; }

        .adventure-event {
            background: var(--glass-bg);
            border-left: 3px solid var(--accent);
            padding: 14px 16px;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin: 10px 0;
            line-height: 1.6;
            font-size: 0.9rem;
            color: var(--text);
        }
        .adventure-meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 0.85rem; color: var(--text2); }

        .backpack-list { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; }
        .backpack-list li {
            background: var(--glass-bg);
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 0.78rem;
            color: var(--text2);
            border: 1px solid var(--glass-border);
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(30, 40, 50, 0.85);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px 24px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            animation: toastIn 0.35s ease, toastOut 0.4s ease 2.5s forwards;
            pointer-events: none;
            letter-spacing: 0.03em;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateX(-50%) translateY(0); } to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a3a50; border-radius: 2px; }

        .tomato-display { font-size: 2.4rem; font-weight: 700; text-align: center; color: #f0c040; margin: 8px 0; font-variant-numeric: tabular-nums; }
        .tomato-preset { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .tomato-preset .btn { font-size: 0.75rem; padding: 4px 10px; }
        .tomato-custom {
            padding: 4px 6px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text);
            font-size: 0.75rem;
            width: 70px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; gap: 12px; }
            .sidebar { width: 100%; flex-direction: column; gap: 10px; }
            .traveler-bar { width: 100%; justify-content: space-around; padding: 10px 8px; }
            .traveler-bar .stat { font-size: 0.8rem; }
            .stat-bar-wrap { width: 40px; }
            .tab-nav { flex-direction: row; flex-wrap: wrap; width: 100%; gap: 6px; }
            .tab-btn { width: auto; flex: 1 0 auto; padding: 10px 8px; font-size: 0.8rem; text-align: center; }
            .panel-area { height: calc(100vh - 300px); min-height: 400px; width: 100%; }
            .panel { padding: 14px 12px; }
            .input-row { flex-direction: column; gap: 8px; }
            .input-row input.dur-input { flex: none; width: 100%; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
            .tomato-display { font-size: 2.2rem; margin: 10px 0; }
            .tomato-preset { justify-content: center; }
            .tomato-preset .btn {
                font-size: 0.75rem;
                padding: 4px 10px;
                background: var(--glass-bg);
                border: 1px solid var(--glass-border);
                color: var(--text);
            }
            .tomato-section > div:last-child { flex-wrap: wrap; gap: 8px; }
            .tomato-section > div:last-child .btn,
            .tomato-section > div:last-child input {
                flex: 1 0 auto;
                width: 120px;
                padding: 4px 8px;
                border-radius: 16px;
                border: 1px solid var(--glass-border);
                background: var(--glass-bg);
                color: var(--text);
                font-size: 0.78rem;
            }
            #tomatoTaskInput { width: 100% !important; }
            .adventure-meta { flex-direction: column; align-items: flex-start; gap: 6px; }
            .glass,
            .traveler-bar,
            .panel-area,
            .card-item,
            .tab-btn {
                background: rgba(20, 24, 36, 0.92) !important;  /* 深色半透明（可改为纯色） */
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
            .toast {
                background: rgba(0, 0, 0, 0.85) !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
        }
        @keyframes fallWind {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.9; }
            25% { transform: translateY(25vh) rotate(90deg) translateX(50px); opacity: 0.7; }
            50% { transform: translateY(50vh) rotate(180deg) translateX(-30px); opacity: 0.5; }
            75% { transform: translateY(75vh) rotate(270deg) translateX(40px); opacity: 0.4; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(-20px); opacity: 0.15; }
        }
        @keyframes fallSparkle {
            0% { transform: translateY(0) scale(0.8); opacity: 0.3; }
            50% { transform: translateY(50vh) scale(1.2); opacity: 0.8; }
            100% { transform: translateY(105vh) scale(0.8); opacity: 0.3; }
        }
        /* ========== 濒死梦境覆盖层 ========== */
        .dream-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; /* 高于所有游戏元素 */
            pointer-events: none; /* 默认隐藏时不阻挡交互 */
            background: linear-gradient(180deg, #f0f8e8 0%, #d0e8d0 40%, #b0d0a0 100%);
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            transition: filter 2s ease, opacity 2s ease;
        }
        .dream-overlay.active {
            pointer-events: auto; /* 显示时可交互 */
        }
        .dream-overlay.fading {
            filter: blur(8px) brightness(0.3);
            opacity: 0;
            pointer-events: none;
        }

        /* 梦境内部元素：阳光、草地、花瓣、卡片等 */
        .dream-overlay .sun-glow {
            position: fixed; top: 5%; left: 50%; transform: translateX(-50%);
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(255,245,210,0.5) 0%, transparent 70%);
            border-radius: 50%; z-index: 101;
            animation: sunPulse 10s ease-in-out infinite alternate;
        }
        @keyframes sunPulse {
            0% { opacity: 0.5; transform: translateX(-50%) scale(1); }
            100% { opacity: 0.85; transform: translateX(-50%) scale(1.12); }
        }

        .dream-overlay .ground {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 28%;
            background: linear-gradient(180deg, rgba(160,200,140,0.2) 0%, rgba(120,160,100,0.45) 50%, rgba(90,140,70,0.55) 100%);
            z-index: 101;
        }

        .dream-overlay .petals-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 102;
        }
        .dream-overlay .petal {
            position: absolute; top: -50px; font-size: 1.3rem;
            user-select: none;
            animation: petalFall linear infinite;
        }
        @keyframes petalFall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.9; }
            25% { transform: translateY(25vh) rotate(100deg) translateX(35px); opacity: 0.7; }
            50% { transform: translateY(50vh) rotate(200deg) translateX(-25px); opacity: 0.5; }
            75% { transform: translateY(75vh) rotate(300deg) translateX(30px); opacity: 0.35; }
            100% { transform: translateY(108vh) rotate(400deg) translateX(-18px); opacity: 0.1; }
        }

        .dream-card {
            position: relative; z-index: 103;
            background: rgba(255,255,255,0.22); backdrop-filter: blur(12px);
            border-radius: 24px; padding: 34px 28px;
            max-width: 480px; width: 90%;
            text-align: center;
            box-shadow: 0 8px 36px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.45);
            margin: auto;
        }
        .dream-card h2 {
            font-size: 2.2rem; margin-bottom: 6px; color: #3a5a3a;
            font-weight: 450; letter-spacing: 0.06em;
        }
        .dream-card .subtitle {
            font-size: 0.85rem; color: #6a8a6a; margin-bottom: 16px;
        }
        .dream-card .description {
            font-size: 0.95rem; color: #5a7a5a; line-height: 1.9; margin: 14px 0;
        }
        .dream-card .btn-sleep {
            position: relative;
            display: inline-block; margin-top: 18px; padding: 12px 28px;
            background: rgba(130,170,130,0.25); border: 1px solid rgba(80,120,80,0.45);
            border-radius: 30px; color: #3a5a3a; font-size: 0.95rem;
            cursor: pointer; transition: 0.35s; letter-spacing: 0.04em;
        }
        .dream-card .btn-sleep:hover {
            background: rgba(110,155,110,0.45); color: #1e3a1e; transform: scale(1.03);
        }
        .dream-card .btn-wake {
            position: absolute;           /* 相对于 .btn-sleep 定位 */
            left: 100%;                   /* 紧贴主按钮右侧 */
            top: 50%;
            transform: translateY(-50%);
            margin-left: 12px;            /* 与主按钮的间距 */
            padding: 6px 14px;
            font-size: 0.72rem;
            background: rgba(200,160,120,0.25);
            border: 1px solid rgba(160,120,80,0.4);
            border-radius: 20px;
            color: #5a4a3a;
            cursor: pointer;
            transition: opacity 0.3s, background 0.3s;
            opacity: 0;                   /* 初始透明，占位不跳动 */
            pointer-events: none; 
            white-space: nowrap;
        }

        .dream-card .btn-wake.show {      /* 新增：出现时 */
            opacity: 1;
            pointer-events: auto; 
        }

        .dream-card .btn-wake:hover {
            background: rgba(180,140,100,0.4);
            color: #2a1a0a;
        }

        /* 呼喊文字 */
        .dream-overlay .shout-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 150;
        }
        .dream-overlay .shout-text {
            position: absolute;
            font-size: 1.8rem; font-weight: 600; letter-spacing: 0.08em;
            color: rgba(220, 240, 255, 0.95);
            text-shadow: 0 0 12px rgba(180,210,255,0.8), 0 0 30px rgba(140,180,240,0.5), 0 2px 8px rgba(0,0,0,0.25);
            white-space: nowrap;
            animation: shoutFade 2.2s ease-out forwards;
            opacity: 0;
        }
        @keyframes shoutFade {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
            30% { opacity: 0.9; transform: translate(-50%, -50%) scale(1); }
            70% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
        }

        /* 黑暗覆盖层（醒来时使用） */
        .dream-dark-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0e17; z-index: 200;
            pointer-events: none; opacity: 0;
            transition: opacity 2.5s ease;
        }
        .dream-dark-overlay.active {
            opacity: 1;
        }
        .tomato-drop-area {
            margin-top: 8px;
            border-top: 1px solid var(--border);
            padding-top: 6px;
            font-size: 0.7rem;
            color: #b0c8d8;
        }
        .drop-list {
            list-style: none;
            padding: 0;
            margin: 4px 0 0 0;
            max-height: 80px;
            overflow-y: auto;
        }
        .drop-list li {
            padding: 2px 0;
            border-bottom: 1px solid #1a2a3a;
            font-size: 0.68rem;
        }
                /* ========== 主题配色定义 ========== */
        body {
            transition: background-color 0.8s ease, background-image 0.8s ease;
        }

        /* 主题配色 */
        body.theme-classic {
            --bg-color: #0a0e17;
            --bg-gradient: radial-gradient(ellipse at 50% 0%, #1a2a3a 0%, #0a0e17 70%);
            --text: #d0d8e8;
            --text2: #94a3b8;
            --accent: #5eb0e5;
            --gold: #f0c060;
        }
        
        body.theme-ember {
            --bg-color: #1e1814;
            --bg-gradient: radial-gradient(ellipse at 50% 100%, #4a3020 0%, #2a1a10 30%, #1e1814 70%);
            --text: #d0c8b8;
            --text2: #a09080;
            --accent: #e89050;
            --gold: #e0a040;
        }

        function getLocalDate(ts = Date.now()) { const d = new Date(ts + UTC_OFFSET_HOURS*3600000); return d.toISOString().slice(0,10); }
        function getToday() { return getLocalDate(); }
        function getYesterday() { const d = new Date(Date.now() + UTC_OFFSET_HOURS*3600000 - 86400000); return d.toISOString().slice(0,10); }
        function randInt(max) { return Math.floor(Math.random()*max); }
        function randChoice(arr) { return arr[randInt(arr.length)]; }
        function clamp(v,lo,hi) { return Math.max(lo, Math.min(hi, v)); }
        // 统一格式化当前时刻（ Asia/Shanghai ），用于日志时间戳
        function nowTimeStr() {
            return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Shanghai' });
        }
        // 将一条日志压入旅行者日志，并保持长度不超过 10

            // ==================== 背景主题切换（支持解锁） ====================

        function forceSaveAll() {

        // 存档迁移：补全旧版本缺少的字段
        function migrateSaveData() {
            // travelerState 补全
            if (travelerState.tentLevel === undefined) travelerState.tentLevel = 0;
            if (travelerState.lastStreak === undefined) travelerState.lastStreak = 0;
            if (!travelerState.backpack) travelerState.backpack = [];

        // ==================== 物品查询与堆叠 ====================
        function getItemByName(name) {
            for (const pool of Object.values(CARD_POOL)) for (const item of pool) if (item[0] === name) return item;
            for (const pool of Object.values(DROP_POOL)) for (const item of pool) if (item[0] === name) return item;
            // 新增：搜索求生破烂池
            for (const item of SURVIVAL_SCRAPS) if (item[0] === name) return item;
            return null;
        }
        function getTravelerUseText(name) { const i = getItemByName(name); return i ? i[3] : null; }
        function getItemEffect(name) { const i = getItemByName(name); return i ? i[5] : null; }
        function getItemCategory(name) { const i = getItemByName(name); return i ? i[4] : null; }
        function getCardRarity(name) {
            for (const [r, pool] of Object.entries(CARD_POOL)) for (const item of pool) if (item[0] === name) return r;
            for (const [r, pool] of Object.entries(DROP_POOL)) for (const item of pool) if (item[0] === name) return r;
            return '普通';
        }

        function addUserItem(name, desc, count = 1) {
            if (count <= 0) return;
            const existing = userData.cards.find(c => c[0] === name);
            if (existing) {
                existing[2] = (existing[2] || 1) + count;
            } else {
                userData.cards.push([name, desc, count]);
            }
        }
        function removeUserItem(name, count = 1) {
            const idx = userData.cards.findIndex(c => c[0] === name);
            if (idx === -1) return false;
            const item = userData.cards[idx];
            if (item[2] > count) {
                item[2] -= count;
            } else {
                userData.cards.splice(idx, 1);
            }
            return true;
        }
        function getAllOwnedNames() {
            const names = new Set();
            userData.cards.forEach(c => names.add(c[0]));
            travelerState.backpack.forEach(([name]) => names.add(name));
            return names;
        }
        
        // ==================== 旅行者状态 ====================
        function updateTravelerState(nowSec = Date.now()/1000) {
            const elapsed = nowSec - (travelerState.lastUpdate || nowSec);
            const hours = Math.min(elapsed / 3600, MAX_OFFLINE_HOURS);
            if (hours <= 0) return;

            // 帐篷减免比例
            const tentReduction = (travelerState.tentLevel > 0 && travelerState.tentLevel <= TENT_LEVELS.length)
                ? TENT_LEVELS[travelerState.tentLevel - 1].reduction
                : 0;

            // 天气衰减倍率
            const weatherName = adventureState.weather || '晴朗';
            const wRate = WEATHER_RATES[weatherName] || { temp: 1, mood: 1, health: 1, hunger: 1 };
            const wr = {
                temp: wRate.temp ?? 1,
                mood: wRate.mood ?? 1,
                health: wRate.health ?? 1,
                hunger: wRate.hunger ?? 1
            };

            // 自然衰减（应用帐篷减免 + 天气倍率）
            travelerState.temperature = Math.max(-30, travelerState.temperature - hours * 1 * (1 - tentReduction) * wr.temp);
            travelerState.mood        = Math.max(0,   travelerState.mood        - hours * 2 * (1 - tentReduction * 0.5) * wr.mood);
            travelerState.hunger      = Math.max(0,   travelerState.hunger      - hours * 5 * (1 - tentReduction * 0.3) * wr.hunger);

            // 帐篷对健康有间接保护
            travelerState.health = Math.max(0, travelerState.health - hours * (tentReduction >= 0.8 ? 0.3 : tentReduction >= 0.4 ? 0.6 : 1.0) * wr.health);

            // 饱腹过低额外扣血
            if (travelerState.hunger < 10) {
                travelerState.health = Math.max(0, travelerState.health - hours * 2);
            }

            // 专注奖励（在线且今日专注 ≥120 分钟）
            const todayStats = calcStats(getToday());
            const todayFocus = todayStats.totalDurationToday;
            const isOnline = elapsed < 600; // 10分钟内视为在线
            if (todayFocus >= 120 && isOnline) {
                travelerState.temperature = Math.min(10,  travelerState.temperature + hours * 0.6);
                travelerState.mood        = Math.min(100, travelerState.mood        + hours * 1.6);
                travelerState.hunger      = Math.min(100, travelerState.hunger      + hours * 3.2);
                travelerState.health      = Math.min(100, travelerState.health      + hours * 0.8);
            }

            // 钳制数值
            travelerState.temperature = clamp(travelerState.temperature, -30, 10);
            travelerState.health      = clamp(travelerState.health,      0, 100);
            travelerState.hunger      = clamp(travelerState.hunger,      0, 100);
            travelerState.mood        = clamp(travelerState.mood,        0, 100);

            // 离线使用背包物品
            if (hours > 0.5) {
                const usageCycles = Math.floor(hours);
                for (let i = 0; i < usageCycles; i++) {
                    autoUseBackpackItem();
                    if (travelerState.backpack.length === 0) break;
                }
            }

            // 帐篷升级/降级
            const todayStr = getToday();
            if (todayStr !== (travelerState.tentCheckedDate || '')) {
                const currentStreak = calcStats().streak;
                // 根据当前连续天数重新计算帐篷等级（支持平滑升降）
                let newLevel = 0;
                for (let i = TENT_LEVELS.length - 1; i >= 0; i--) {
                    if (currentStreak >= TENT_LEVELS[i].days) {
                        newLevel = i + 1;
                        break;
                    }
                }
                const oldLevel = travelerState.tentLevel || 0;
                if (newLevel > oldLevel) {
                    travelerState.tentLevel = newLevel;
                    pushTravelerLog(`${nowTimeStr()} ⛺ ${TENT_LEVELS[newLevel - 1].log}`);
                } else if (newLevel < oldLevel && newLevel === 0) {
                    travelerState.tentLevel = 0;
                    pushTravelerLog(`${nowTimeStr()} 🏕️ 连续天数减少，帐篷已被风雪摧毁。`);
                } else if (newLevel < oldLevel) {
                    travelerState.tentLevel = newLevel;
                    pushTravelerLog(`${nowTimeStr()} 🏕️ 连续天数减少，帐篷降级至「${TENT_LEVELS[newLevel - 1].name}」。`);
                }
                travelerState.lastStreak = currentStreak;
                travelerState.tentCheckedDate = todayStr;
            }

            // 脏标记
            const dTemp = Math.abs(travelerState.temperature - lastSavedTraveler.temperature);
            const dHealth = Math.abs(travelerState.health - lastSavedTraveler.health);
            const dHunger = Math.abs(travelerState.hunger - lastSavedTraveler.hunger);
            const dMood = Math.abs(travelerState.mood - lastSavedTraveler.mood);
            const dTent = Math.abs(travelerState.tentLevel - lastSavedTraveler.tentLevel);
            if (dTemp >= 2 || dHealth >= 2 || dHunger >= 3 || dMood >= 3 || dTent >= 1) {
                markDirty();
            }
            travelerState.lastUpdate = nowSec;
        }

        function applyEffect(effect) {
            if (effect.health) travelerState.health = clamp(travelerState.health + effect.health, 0, 100);
            if (effect.hunger) travelerState.hunger = clamp(travelerState.hunger + effect.hunger, 0, 100);
            if (effect.mood) travelerState.mood = clamp(travelerState.mood + effect.mood, 0, 100);
            if (effect.temp) travelerState.temperature = clamp(travelerState.temperature + effect.temp, -30, 10);

            // 饱腹过低导致的生命衰减（每8秒损失1点，离线由 updateTravelerState 中的 self-sustain 来模拟）
            if (travelerState.hunger < 20) {
                travelerState.health = clamp(travelerState.health - 1, 0, 100);
            }
        }
        function formatEffects(effects) {
            const emoji = { health: '❤️', hunger: '🍞', mood: '😊', temp: '🌡️' };
            const parts = [];
            for (const key of ['health', 'hunger', 'mood', 'temp']) {
                const val = effects[key];
                if (val) parts.push(`${emoji[key]}${val > 0 ? '+' + val : val}`);
            }
            return parts.join(' ');
        }

        function autoUseBackpackItem() {
            const bp = travelerState.backpack;
            if (!bp.length) return null;

            const needs = [
                { stat: 'hunger', threshold: 20, category: 'food' },
                { stat: 'health', threshold: 30, category: 'medical' },
                { stat: 'temperature', threshold: -15, category: 'warm' },
                { stat: 'mood', threshold: 20, category: 'support' },
            ];

            for (const need of needs) {
                if (travelerState[need.stat] < need.threshold) {
                    const idx = bp.findIndex(([name]) => getItemCategory(name) === need.category);
                    if (idx === -1) continue;

                    const item = bp[idx];
                    const itemName = item[0];
                    const durability = item[2] || 1;
                    const effect = getItemEffect(itemName);

                    // 耐久物品处理
                    if (effect?.durability !== undefined) {
                        if (Math.random() < 0.3) {
                            const newDurability = durability - 1;
                            const useEffect = effect.onUse || {};
                            if (Object.keys(useEffect).length > 0) {
                                applyEffect(useEffect);
                            } else {
                                ['hunger','health','temp','mood'].forEach(k => {
                                    if (effect[k] !== undefined) applyEffect({[k]: effect[k]});
                                });
                            }
                            const useText = getTravelerUseText(itemName) || `旅行者使用了${itemName}。`;
                            pushTravelerLog(`${nowTimeStr()} ${useText}（剩余耐久：${newDurability}）`);
                            if (newDurability <= 0) {
                                bp.splice(idx, 1);
                            } else {
                                bp[idx] = [itemName, item[1], newDurability];
                            }
                            return useText;
                        } else {
                            continue;
                        }
                    }
                    // 一次性物品处理
                    else {
                        if (effect) applyEffect(effect);
                        const useText = getTravelerUseText(itemName) || `旅行者使用了${itemName}。`;
                        pushTravelerLog(`${nowTimeStr()} ${useText}`);
                        bp.splice(idx, 1);
                        return useText;
                    }
                }
            }
            return null;
        }

        // ==================== 冒险 ====================
        function refreshAdventure() {
            const nowSec = Date.now() / 1000;
            updateTravelerState(nowSec);
            // 解锁血月残象主题
            if (travelerState.health <= 10 && !unlockedThemes.includes('bloodmoon')) {
                unlockTheme('bloodmoon');
            }            

            const isExtreme =
                travelerState.hunger <= 8 ||
                travelerState.mood <= 8 ||
                travelerState.health <= 18 ||
                travelerState.temperature <= -28;

            let eventObj;
            if (isExtreme) {
                const candidates = [];
                if (travelerState.hunger <= 8) candidates.push('hunger');
                if (travelerState.mood <= 8) candidates.push('mood');
                if (travelerState.health <= 18) candidates.push('health');
                
                if (travelerState.temperature <= -28) candidates.push('temp');
                const type = candidates[Math.floor(Math.random() * candidates.length)];
                eventObj = EXTREME_EVENTS[type] ? randChoice(EXTREME_EVENTS[type]) : randChoice(EVENT_POOL);
            } else {
                eventObj = randChoice(EVENT_POOL);
            }

            // 极端事件仅展示文本，不扣除数值
            if (!isExtreme) {
                applyEffect(eventObj.effects);
            }

            // 记录日志
            const timeStr = nowTimeStr();
            if (isExtreme) {
                // 极端状态：只记录通用文本，不显示具体效果
                pushTravelerLog(`${timeStr} ⚠️旅行者陷入了绝境，正在艰难挣扎。`);
            } else {
                // 普通事件：正常显示效果数值
                const effectStr = formatEffects(eventObj.effects);
                if (effectStr) {
                    pushTravelerLog(`${timeStr} 事件：${effectStr}`);
                }
            }

           // 天气变化更新飘雪
            const newWeather = randChoice(WEATHERS);
            if (newWeather !== adventureState.weather) {
                initSnowfall(newWeather);
            }

            // 设置冒险状态（不再包含数值变化）
            adventureState = {
                weather: newWeather,
                event: eventObj.text,
                updatedAt: nowSec,
            };
            forceSaveAll();
        }

        function getAdventureReport() {
            const nowSec = Date.now() / 1000;
            updateTravelerState(nowSec);
            if (!adventureState.updatedAt || nowSec - adventureState.updatedAt >= ADVENTURE_REFRESH_SEC) {
                refreshAdventure();
                    }
                    return {
                        weather: adventureState.weather,
                        event: adventureState.event,
                        updatedAt: adventureState.updatedAt,
                        traveler: { ...travelerState },
                    };
                }

        // ==================== 打卡与统计 ====================
        function addCheckin(task, duration) {
            const today = getToday();
            userData.checkins[today] = userData.checkins[today] || [];
            userData.checkins[today].push({
                timestamp: Math.floor(Date.now() / 1000),
                task: task || '通用',
                done: true,
                duration: duration || null,
            });
            forceSaveAll();
        }

        function clearTodayCheckins(taskName = null) {
            const today = getToday();
            if (!userData.checkins[today]) return 0;
            if (taskName) {
                const before = userData.checkins[today].length;
                userData.checkins[today] = userData.checkins[today].filter(e => e.task !== taskName);
                return before - userData.checkins[today].length;
            } else {
                const cnt = userData.checkins[today].length;
                delete userData.checkins[today];
                return cnt;
            }
        }
        // 根据时间戳删除单条打卡记录
        function removeCheckinByTimestamp(timestamp) {
            const today = getToday();
            if (!userData.checkins[today]) return false;
            const before = userData.checkins[today].length;
            userData.checkins[today] = userData.checkins[today].filter(e => e.timestamp !== timestamp);
            const changed = userData.checkins[today].length < before;
            if (changed) {
                if (userData.checkins[today].length === 0) delete userData.checkins[today];
                forceSaveAll();
            }
            return changed;
        }

        // 更新指定记录的任务名称
        function updateCheckinTask(timestamp, newTask) {
            const today = getToday();
            if (!userData.checkins[today]) return false;
            const entry = userData.checkins[today].find(e => e.timestamp === timestamp);
            if (entry) {
                entry.task = newTask;
                forceSaveAll();
                return true;
            }
            return false;
        }
        function calcStats(filterDate = null) {
            const days = Object.keys(userData.checkins).sort();
            if (!days.length) return { total: 0, streak: 0, tasks: {}, totalDurationToday: 0 };
            const today = getToday(), yesterday = getYesterday();
            const dateSet = new Set(days);
            let streak = 0, d = yesterday;
            while (dateSet.has(d)) {
                streak++;
                d = getLocalDate(new Date(d + 'T00:00:00+08:00').getTime() - 86400000);
            }
            if (dateSet.has(today)) streak++;
            const tasks = {};
            const entries = filterDate ? (userData.checkins[filterDate] || []) : Object.values(userData.checkins).flat();
            for (const e of entries) {
                tasks[e.task] = tasks[e.task] || { count: 0, totalDuration: 0 };
                tasks[e.task].count++;
                if (e.duration != null) tasks[e.task].totalDuration += e.duration;
            }
            let totalDurationToday = 0;
            if (filterDate === getToday()) {
                totalDurationToday = (userData.checkins[getToday()] || []).reduce((s, e) => s + (e.duration || 0), 0);
            }
            return { total: days.length, streak, tasks, totalDurationToday };
        }

        // ==================== 抽卡与掉落 ====================
        function drawCard(ownedNames, preferRarity = null) {
            const allAvailable = [];
            for (const [rarity, pool] of Object.entries(CARD_POOL))
                for (const item of pool)
                    if (!ownedNames.has(item[0])) allAvailable.push({ name: item[0], desc: item[1], rarity });
            if (!allAvailable.length) return null;
            if (preferRarity) {
                const candidates = allAvailable.filter(c => c.rarity === preferRarity);
                if (candidates.length) return randChoice(candidates);
            }
            return randChoice(allAvailable);
        }

        function drawByProbability(ownedNames) {
            const r = Math.random();
            const prefer = r >= 0.95 ? '传说' : r >= 0.7 ? '稀有' : '普通';
            return drawCard(ownedNames, prefer);
        }

        function processDailyDraw() {
            const today = getToday();
            if (!(today in userData.checkins)) return null; // 今日无打卡

            const streak = calcStats().streak;
            const ownedNames = getAllOwnedNames();

            // 检查今天是否已抽过每日卡
            if (userData.lastDailyDraw === today && userData.weeklyEggClaimed !== today && streak >= 7) {
                // 今日已抽过卡，但连续7天彩蛋未领 → 允许抽彩蛋
            } else if (userData.lastDailyDraw === today) {
                return null; // 今天已经抽过卡，且无彩蛋可领
            }

            let card, isExtra = false;
            if (streak >= 7 && userData.weeklyEggClaimed !== today) {
                isExtra = true;
                card = drawCard(ownedNames, '传说');
                if (card) userData.weeklyEggClaimed = today;
            } else {
                card = drawByProbability(ownedNames);
            }

            if (card) {
                addUserItem(card.name, card.desc, 1);
                userData.lastDailyDraw = today;
                forceSaveAll();
                return { name: card.name, desc: card.desc, isExtra };
            } else {
                userData.lastDailyDraw = today; // 防止无卡可抽时仍能无限抽
                forceSaveAll();
                return null;
            }
        }

    

        // ==================== 番茄钟模块 ====================

        let currentTomatoDrops = []; // 存储本次掉落的物品 { name, rarity }
        let tomatoState = {
            totalSeconds: 25 * 60,
            remainingSeconds: 25 * 60,
            elapsedFocusSeconds: 0,
            status: 'idle',
            intervalId: null,
            lastTickTime: null,
            taskName: '番茄钟专注',

        };

        function formatTomatoTime(sec, mode) {
            if (mode === 'stopwatch') {
                // 正计时：显示已用时间 MM:SS
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return '+' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            } else {
                // 倒计时：显示剩余时间
                const m = Math.floor(Math.max(0, sec) / 60);
                const s = Math.floor(Math.max(0, sec) % 60);
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }
        }

        function updateTomatoUI() {
            const display = document.getElementById('tomatoDisplay');
            const startBtn = document.getElementById('btnTomatoStart');
            const modeBtn = document.getElementById('btnTomatoMode');

            if (display) {
                if (tomatoState.mode === 'stopwatch') {
                    display.textContent = formatTomatoTime(tomatoState.elapsedFocusSeconds, 'stopwatch');
                } else {
                    display.textContent = formatTomatoTime(tomatoState.remainingSeconds, 'countdown');
                }
            }

            if (startBtn) {
                if (tomatoState.status === 'running') {
                    startBtn.textContent = '⏸ 暂停';
                    startBtn.className = 'btn btn-outline btn-sm';
                } else {

                }
            }

            if (modeBtn) {
                modeBtn.textContent = tomatoState.mode === 'countdown' ? '⏱ 正计时' : '⏳ 倒计时';
            }

            const stopBtn = document.getElementById('btnTomatoStop');
            if (stopBtn) stopBtn.disabled = (tomatoState.status === 'idle');
            // 更新网页标题
            const timeStr = tomatoState.mode === 'stopwatch'
                ? formatTomatoTime(tomatoState.elapsedFocusSeconds, 'stopwatch')
                : formatTomatoTime(tomatoState.remainingSeconds, 'countdown');
            document.title = `${timeStr} - 卡卡查克 · 雪原冒险`;
        }

        function startTomato() {
            if (tomatoState.status === 'running') {
                pauseTomato();
                return;
            }
            if (tomatoState.status === 'idle') {
                // 全新开始
                tomatoState.status = 'running';
                tomatoState.startTime = Date.now();
                tomatoState.elapsedFocusSeconds = 0;
                tomatoState.remainingSeconds = tomatoState.totalSeconds;
            } else if (tomatoState.status === 'paused') {
                // 从暂停恢复：调整 startTime 以保持累计
                tomatoState.status = 'running';
                const now = Date.now();
                if (tomatoState.mode === 'countdown') {
                    const accumulated = tomatoState.totalSeconds - tomatoState.remainingSeconds;
                    tomatoState.startTime = now - (accumulated * 1000);
                } else {
                    tomatoState.startTime = now - (tomatoState.elapsedFocusSeconds * 1000);
                }
            }
            if (!tomatoState.intervalId) {
                tomatoState.intervalId = setInterval(tickTomato, 1000);
            }
            scheduleTomatoCompletion();
            updateTomatoUI();
        }

        function pauseTomato() {
            if (tomatoState.status === 'running') {
                const now = Date.now();
                const delta = (now - tomatoState.startTime) / 1000;
                if (tomatoState.mode === 'stopwatch') {
                    tomatoState.elapsedFocusSeconds += delta;
                } else {
                    tomatoState.remainingSeconds = Math.max(0, tomatoState.totalSeconds - (tomatoState.elapsedFocusSeconds + delta));
                    tomatoState.elapsedFocusSeconds += delta;
                }
                tomatoState.status = 'paused';
                clearInterval(tomatoState.intervalId);
                tomatoState.intervalId = null;
                clearTomatoCompletion();
                updateTomatoUI();
            }
        }

        function stopTomato(record = true) {
            if (tomatoState.status === 'idle') return;

            // 计算实际专注秒数
            let realElapsed = 0;
            if (tomatoState.status === 'running') {
                const now = Date.now();
                if (tomatoState.mode === 'stopwatch') {
                    realElapsed = tomatoState.elapsedFocusSeconds + (now - tomatoState.startTime) / 1000;
                } else {
                    // countdown: (now - startTime) 已包含全部经过时间（暂停恢复时 startTime 已调整），无需再加 previousElapsed
                    realElapsed = (now - tomatoState.startTime) / 1000;
                }
            } else if (tomatoState.status === 'paused') {
                realElapsed = tomatoState.elapsedFocusSeconds;
            }

            

            if (record && realElapsed >= 60) {
                const minutes = Math.floor(realElapsed / 60);
                addCheckin(tomatoState.taskName || '番茄钟专注', minutes);
                let msg = `✅ 番茄钟完成！已记录 ${minutes} 分钟专注。`;

                // 清空上次记录，准备装新掉落
                currentTomatoDrops = [];

                // ---------- 掉落逻辑 ----------
                if (minutes >= 15) {                // 正式版用 15，测试可改为 1
                    const slotCount = Math.min(Math.floor(minutes / 30) + 1, 4);
                    for (let i = 0; i < slotCount; i++) {
                        let preferRarity = '普通';
                        if (minutes >= 45) {
                            const rand = Math.random();
                            if (rand < 0.1) preferRarity = '传说';
                            else if (rand < 0.3) preferRarity = '稀有';
                        }

                        if (preferRarity === '普通') {
                            const item = dropCommonItem();
                            if (item) {
                                currentTomatoDrops.push({ name: item[0], rarity: '普通' });
                                msg += ' 🎒 获得【' + item[0] + '】';
                            }
                        } else {
                            const item = dropRareOrLegendaryItem(preferRarity);
                            if (item) {
                                currentTomatoDrops.push({ name: item[0], rarity: preferRarity });
                                msg += ' 🎒 获得【' + item[0] + '】';
                            } else {
                                // 池空降级为普通
                                const commonItem = dropCommonItem();
                                if (commonItem) {
                                    currentTomatoDrops.push({ name: commonItem[0], rarity: '普通（' + preferRarity + '池空）' });
                                    msg += ' 🎒 获得【' + commonItem[0] + '】（' + preferRarity + '池已空）';
                                }
                            }
                        }
                    }
                }

                showToast(msg, 4000);
                forceSaveAll();
                renderPanel('checkin');   // 重新渲染打卡面板（会用到 currentTomatoDrops）
                updateTravelerBar();
            } else if (record && realElapsed < 60) {
                showToast('⚠️ 专注时间不足1分钟，未记录打卡。', 2500);
            }

            // 清理计时器，重置番茄钟状态
            if (tomatoState.intervalId) {
                clearInterval(tomatoState.intervalId);
                tomatoState.intervalId = null;
            }
            clearTomatoCompletion();
            tomatoState.status = 'idle';
            tomatoState.elapsedFocusSeconds = 0;
            tomatoState.remainingSeconds = tomatoState.totalSeconds;
            updateTomatoUI();
        }

        function tickTomato() {
            if (tomatoState.status !== 'running') return;
            const now = Date.now();
            const totalElapsed = (now - tomatoState.startTime) / 1000;

            if (tomatoState.mode === 'stopwatch') {
                tomatoState.elapsedFocusSeconds = totalElapsed;
            } else {
                const remaining = tomatoState.totalSeconds - totalElapsed;
                tomatoState.elapsedFocusSeconds = totalElapsed;
                if (remaining <= 0) {
                    tomatoState.remainingSeconds = 0;
                    stopTomato(true);
                    return;
                }
                tomatoState.remainingSeconds = remaining;
            }
            updateTomatoUI();
        }

        // ---- 后台/可见性补偿 ----
        // 记录一次性"到点完成"定时器（后台比逐秒 setInterval 更可靠触发）
        let tomatoCompletionTimer = null;
        function scheduleTomatoCompletion() {
            clearTimeout(tomatoCompletionTimer);
            tomatoCompletionTimer = null;
            // 仅倒计时运行时需要到点完成
            if (tomatoState.status !== 'running' || tomatoState.mode !== 'countdown') return;
            const endMs = tomatoState.startTime + tomatoState.totalSeconds * 1000;
            const delay = endMs - Date.now();
            if (delay <= 0) return; // 已到点，交给 tickTomato 处理
            tomatoCompletionTimer = setTimeout(() => {
                if (tomatoState.status === 'running') tickTomato();
            }, delay + 50);
        }
        function clearTomatoCompletion() {
            if (tomatoCompletionTimer) {
                clearTimeout(tomatoCompletionTimer);
                tomatoCompletionTimer = null;
            }
        }
        // 回到页面时，按真实已过时间立即校正/完成（避免只在切回时才结束）
        function reconcileTomato() {

            tomatoState.remainingSeconds = minutes * 60;

            updateTomatoUI();
        }

                tomatoState.remainingSeconds = 0;
            } else {

        // ==================== 飘雪与定时器 ====================
        let snowflakes = []; // 存放当前雪花元素

        function initSnowfall(weather = adventureState.weather) {
            const container = document.getElementById('snowfall');
            // 清除旧雪花
            container.innerHTML = '';
            snowflakes = [];

            const effect = WEATHER_EFFECTS[weather] || WEATHER_EFFECTS['小雪'];
            if (effect.count === 0) return; // 晴朗天气无雪花

            const flakes = ['❄', '❅', '❆', '✦', '•', '·'];
            if (effect.hail) {
                flakes.length = 0;
                flakes.push('•', '·', '⬤');
            }
            if (effect.rain) {
                flakes.length = 0;
                flakes.push('|', '│');
            }

            for (let i = 0; i < effect.count; i++) {
                const span = document.createElement('span');
                span.className = 'snowflake';
                span.textContent = flakes[Math.floor(Math.random() * flakes.length)];

                // 随机大小
                const size = effect.minSize + Math.random() * (effect.maxSize - effect.minSize);
                span.style.fontSize = size + 'rem';
                // 随机下落速度
                const duration = effect.minDur + Math.random() * (effect.maxDur - effect.minDur);
                span.style.animationDuration = duration + 's';
                // 随机透明度
                span.style.opacity = effect.opacity * (0.5 + Math.random() * 0.5);
                // 初始位置
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDelay = Math.random() * 10 + 's';

                // 特殊效果
                if (effect.wind) {
                    span.style.animationName = 'fallWind'; // 需要定义倾斜动画
                } else if (effect.sparkle) {
                    span.style.animationName = 'fallSparkle'; // 闪烁
                } else {
                    span.style.animationName = 'fall';
                }

                // 极光颜色
                if (effect.aurora) {
                    const colors = ['#a0f0c0', '#80c0ff', '#c0a0ff', '#f0c0e0'];
                    span.style.color = colors[Math.floor(Math.random() * colors.length)];
                    span.style.textShadow = '0 0 4px #fff, 0 0 10px currentColor';
                }

                container.appendChild(span);
                snowflakes.push(span);
            }
        }

        // ==================== 番茄钟掉落辅助函数 ====================
        // --- 普 通 掉 落 ---
        function dropCommonItem() {
            if (DROP_POOL["普通"].length === 0) return null;
            const item = randChoice(DROP_POOL["普通"]);
            addUserItem(item[0], item[1]);
            return item;
        }

        // --- 稀 有 / 传 说 掉 落（过滤已拥有） ---
        function dropRareOrLegendaryItem(rarity) {
            const ownedNames = getAllOwnedNames();
            const pool = DROP_POOL[rarity];
            if (!pool || pool.length === 0) return null;
            const available = pool.filter(item => !ownedNames.has(item[0]));
            if (available.length === 0) return null;
            const item = randChoice(available);
            addUserItem(item[0], item[1]);
            return item;
        }

                // 梦境按钮绑定
            const sleepBtn = document.getElementById('dreamBtnSleep');
            if (sleepBtn) sleepBtn.addEventListener('click', handleDreamSleep);
            const wakeBtn = document.getElementById('dreamBtnWake');
            if (wakeBtn) wakeBtn.addEventListener('click', hideDream);
            // 将关键函数暴露给内联事件（备用）
            window.handleDreamSleep = handleDreamSleep;
            window.hideDream = hideDream;
            initVisibilityHandlers();
            startTickers();
            renderPanel('checkin');
            updateTravelerBar();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();

        window.addEventListener('beforeunload', () => {
            updateTravelerState(Date.now() / 1000);
            forceSaveAll();
        });
        // ==================== 安瑟小猫聊天 ====================
        const ANSER_API_URL = 'https://umlla.qzz.io/chat'; // 替换
        const ANSER_TOKEN   = 'anser-cat-secret-2062';       // 替换

        let chatMinimized = true;
        // 获取或创建持久用户 ID（存于 localStorage）
        function getUserId() {
            let userId = localStorage.getItem('anser_user_id');
            if (!userId) {
                userId = 'user-' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('anser_user_id', userId);
            }
            return userId;
        }

        function initAnserChat() {
            const chatContainer = document.getElementById('anser-chat');
            const chatMessages   = document.getElementById('anser-chat-messages');
            const chatInput      = document.getElementById('anser-chat-input');
            const sendBtn        = document.getElementById('anser-chat-send');
            const toggleBtn      = document.getElementById('anser-chat-toggle');
            const floatBtn       = document.getElementById('anser-chat-float');
            const header         = document.getElementById('anser-chat-header');

            function setMinimized(min) {
                chatMinimized = min;
                if (min) {
                    chatContainer.classList.add('anser-chat-minimized');
                    floatBtn.style.display = 'flex';   // 显示猫爪
                } else {
                    chatContainer.classList.remove('anser-chat-minimized');
                    floatBtn.style.display = 'none';   // 隐藏猫爪
                }
            }

            toggleBtn.addEventListener('click', () => setMinimized(!chatMinimized));
            floatBtn.addEventListener('click', () => setMinimized(false));
            header.addEventListener('click', (e) => {
                if (e.target === header || e.target.tagName === 'SPAN') setMinimized(!chatMinimized);
            });

            function addMessage(type, text) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `anser-msg ${type}`;
                if (type === 'bot') {
                    msgDiv.innerHTML = `<span class="cat-icon">🐱</span><span>${text}</span>`;
                } else {
                    msgDiv.textContent = text;
                }
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // 获取当前游戏上下文，让安瑟感知天气、帐篷和旅行者状态
            function getGameContext() {
                const t = travelerState;
                const w = adventureState.weather || '晴朗';
                const wInfo = WEATHER_RATES[w] || {};
                const tentLvl = t.tentLevel || 0;
                const tentName = tentLvl > 0 ? TENT_DISPLAY_NAMES[tentLvl] : '无帐篷';
                const tentLog = tentLvl > 0 ? TENT_LEVELS[tentLvl - 1].log : '';
                const statusParts = [];
                if (t.temperature <= -20) statusParts.push('快冻僵了');
                else if (t.temperature <= -10) statusParts.push('冷得发抖');
                else if (t.temperature >= 0) statusParts.push('还挺暖和');
                if (t.health <= 15) statusParts.push('生命垂危');
                else if (t.health <= 40) statusParts.push('浑身难受');
                if (t.hunger <= 15) statusParts.push('饿得头晕');
                else if (t.hunger <= 40) statusParts.push('肚子在叫');
                if (t.mood <= 15) statusParts.push('情绪低落');
                else if (t.mood >= 70) statusParts.push('心情不错');
                const statusLine = statusParts.length ? '，' + statusParts.join('，') : '，状态一般';
                const sceneDesc = wInfo.scene || '';
                return `你是住在雪原冒险网页里的一只小猫助手。当前${w}，${sceneDesc}帐篷：${tentName}。${tentLog}旅行者状态——温度：${Math.round(t.temperature)}°C，健康：${Math.round(t.health)}，饱腹：${Math.round(t.hunger)}，心情：${Math.round(t.mood)}${statusLine}。请以小猫安瑟的语气喵喵地回答。`;
            }

            async function sendMessage() {
                const text = chatInput.value.trim();
                if (!text) return;

                addMessage('user', text);
                chatInput.value = '';

                try {
                    const response = await fetch(ANSER_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token: ANSER_TOKEN,
                            message: text,
                            context: getGameContext()
                        })
                    });
                    const data = await response.json();
                    addMessage('bot', data.reply || '喵…本喵的爪子卡住了…');
                } catch (err) {
                    addMessage('bot', `喵…信号不好：${err.message}`);
                }
            }

            sendBtn.addEventListener('click', sendMessage);
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            setMinimized(true);
        }

        // 在 init() 函数中调用 initAnserChat()
    })();
</script>
<!-- ==================== 濒死梦境覆盖层 ==================== -->

    <div class="dream-dark-overlay" id="dreamDarkOverlay"></div>

    <div class="dream-card">
        <h2>🌸 温暖的草地</h2>
        <p class="subtitle">—— 回忆 ——</p>
        <p class="description">
            风很轻，阳光像蜂蜜一样流淌在皮肤上。<br>
            远处的炊烟、熟悉的乡音……<br>
            一切都那么真实，又那么遥远。
        </p>
        <div class="btn-sleep" id="dreamBtnSleep">
        🛌 继续沉睡
        <span class="btn-wake" id="dreamBtnWake">🌬️ 挣扎醒来</span>
        </div>

<div id="anser-chat" class="anser-chat anser-chat-minimized">
    <div class="anser-chat-header" id="anser-chat-header">
        <div class="anser-cat-avatar">🐱</div>

    </div>
    <div class="anser-chat-body">
        <div class="anser-chat-messages" id="anser-chat-messages">
            <div class="anser-msg bot">
                <span class="cat-icon">🐱</span>
                <span>喵～被你发现啦！雪原这么大，你想跟安瑟聊点什么？（输入“/kk”向答案之书提问）</span>
            </div>
        </div>
        <div class="anser-chat-input-row">
            <input type="text" id="anser-chat-input" placeholder="跟小猫说点什么..." autocomplete="off" />

        </div>

</div>
